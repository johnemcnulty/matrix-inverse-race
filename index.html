g glycolysis.","clozeSentence":"Many vitamins are needed in the diet because cells use them to build ___ molecules, the organic helpers that certain enzymes require.","description":"A dehydrogenase cannot oxidize its substrate unless a small organic molecule built from the vitamin niacin binds and accepts electrons. What general type of helper is this molecule?","confusables":["FADH2","NAD+","NADH","NADP+","NADPH","cofactor"],"sourcePages":[9,10,30,55],"correction":null},{"word":"competitive inhibitor","pos":"molecule","definition":"a substrate look-alike that binds the active site and blocks the substrate","contextSentence":"Malonate is a competitive inhibitor of succinate dehydrogenase, a Krebs cycle enzyme, because it resembles succinate and occupies the active site.","clozeSentence":"Because methyl alcohol and ethyl alcohol compete for the same active site of alcohol dehydrogenase, methyl alcohol acts as the ___ in this reaction.","description":"A drug slows an enzyme, but when substrate concentration is raised very high the reaction reaches the same maximum rate as without the drug. What kind of molecule is the drug?","confusables":[],"sourcePages":[9,10,27,30,37,41],"correction":null},{"word":"noncompetitive inhibitor","pos":"molecule","definition":"a molecule that binds away from the active site, changing enzyme shape and lowering activity","contextSentence":"A noncompetitive inhibitor binds an allosteric site and distorts the enzyme, so adding more substrate cannot restore the maximum rate.","clozeSentence":"On the graph, inhibitor B lowered the enzyme's maximum rate even at very high substrate levels, identifying it as the ___.","description":"Isoleucine binds threonine deaminase at a site remote from the active site and lowers its activity no matter how much threonine is present. Acting this way, what is isoleucine?","confusables":[],"sourcePages":[9,10,27,30,37,41],"correction":null},{"word":"allosteric activator","pos":"molecule","definition":"a molecule binding a regulatory site that holds the enzyme in its active, substrate-binding shape","contextSentence":"AMP acts as an allosteric activator: when ATP runs low and AMP builds up, it binds a regulatory site and boosts enzyme activity.","clozeSentence":"When AMP binds a regulatory site on phosphofructokinase and increases the enzyme's activity, AMP is acting as the ___.","description":"A small molecule binds a multi-subunit enzyme far from its active sites, locking them into a shape that grabs substrate better, and the rate rises. What is the molecule?","confusables":[],"sourcePages":[39,40],"correction":"Notes said feedback inhibition is an example of allosteric activation; correct: feedback inhibition is a form of allosteric inhibition."},{"word":"catalase","pos":"molecule","definition":"an enzyme that breaks down hydrogen peroxide into water and oxygen gas","contextSentence":"In the potato disk lab, catalase on the filter paper broke down H2O2, and O2 bubbles made disks float faster at higher H2O2 concentrations.","clozeSentence":"Oxygen bubbles form when liver or potato extract is added to hydrogen peroxide because the enzyme ___ converts 2 H2O2 into 2 H2O and O2.","description":"A paper disk soaked in blended potato floats in 10 seconds in 15% hydrogen peroxide but never floats once the potato extract is boiled. Which enzyme was denatured?","confusables":["enzyme"],"sourcePages":[9,13,14,22,29],"correction":null},{"word":"ATP","pos":"molecule","definition":"adenine + ribose + three phosphates; its hydrolysis releases free energy that powers cell work","contextSentence":"Muscle contraction is powered by ATP, whose hydrolysis to ADP and inorganic phosphate releases free energy that drives the motor proteins.","clozeSentence":"Cells drive endergonic reactions by coupling them to hydrolysis of ___ into ADP and inorganic phosphate, which releases about 7.3 kcal/mol.","description":"Making glutamine has ΔG = +3.4 kcal/mol, yet it proceeds when a molecule first transfers its terminal phosphate to glutamic acid, giving an overall ΔG of −3.9. Which molecule donates the phosphate?","confusables":[],"sourcePages":[7,8,48],"correction":"Notes said ΔG = −7.3 kcal/mol is the energy of phosphorylation; correct: it is the free energy released by hydrolysis of ATP to ADP + Pi, which drives the phosphorylation."},{"word":"ADP","pos":"molecule","definition":"an adenine nucleotide with two phosphates, formed when ATP loses its terminal phosphate","contextSentence":"During chemiosmosis, ATP synthase attaches inorganic phosphate to ADP, regenerating ATP as protons flow back into the mitochondrial matrix.","clozeSentence":"When a cell hydrolyzes ATP to power a membrane pump, the products are inorganic phosphate and ___, which must later be phosphorylated again.","description":"After a sprint, a muscle cell's ATP level has dropped while a nucleotide carrying only two phosphate groups has built up. Which molecule must be phosphorylated to restore ATP?","confusables":[],"sourcePages":[7,8,48],"correction":null},{"word":"NAD+","pos":"molecule","definition":"the oxidized electron carrier that accepts electrons and H+ removed from fuel during respiration","contextSentence":"During glycolysis, a dehydrogenase removes electrons from G3P and transfers them to NAD+, which must be regenerated for glycolysis to continue.","clozeSentence":"Fermentation makes no extra ATP; its purpose is to regenerate ___ from NADH so that glycolysis can keep oxidizing glucose.","description":"If all of a cell's respiratory electron carriers are stuck in their reduced form, glycolysis and the Krebs cycle halt. Which oxidized carrier have these pathways run out of?","confusables":["coenzyme","cofactor"],"sourcePages":[55,56,67,68],"correction":"Notes said NAD+ and FAD are the final electron acceptors of the electron transport chain; correct: they are electron carriers, and O2 is the final electron acceptor."},{"word":"NADH","pos":"molecule","definition":"reduced carrier that brings electrons from glycolysis and the Krebs cycle to ETC Complex I","contextSentence":"Each turn of the Krebs cycle produces three NADH, which carry high-energy electrons to Complex I of the electron transport chain.","clozeSentence":"In lactic acid fermentation, ___ donates its electrons directly to pyruvate, forming lactate and regenerating NAD+.","description":"Cyanide blocks the last complex of the electron transport chain. Which reduced carrier made in glycolysis and the Krebs cycle builds up because it can no longer unload electrons at Complex I?","confusables":["coenzyme","cofactor"],"sourcePages":[55,56,60,61,67],"correction":"Notes said each NADH yields about 3 ATP; correct: current estimates are about 2.5 ATP per NADH."},{"word":"FADH2","pos":"molecule","definition":"reduced carrier from the Krebs cycle that donates electrons to the ETC at Complex II","contextSentence":"FADH2 passes its electrons into the chain at Complex II, bypassing Complex I, so it supports fewer protons pumped and less ATP than NADH.","clozeSentence":"Each turn of the Krebs cycle yields one ___, whose electrons enter the chain at Complex II and support about 1.5 ATP.","description":"When succinate is oxidized to fumarate, a carrier is reduced that delivers its electrons downstream of Complex I and so yields less ATP than NADH. Which carrier is it?","confusables":["coenzyme","cofactor"],"sourcePages":[57,60,61,72],"correction":"Notes said each FADH2 yields about 2 ATP; correct: current estimates are about 1.5 ATP per FADH2."},{"word":"NADP+","pos":"molecule","definition":"oxidized carrier that accepts electrons at the end of the light reactions","contextSentence":"At the end of the light reactions, NADP+ reductase passes electrons from photosystem I, via ferredoxin, to NADP+ in the stroma.","clozeSentence":"The Calvin cycle returns ADP, inorganic phosphate and ___ to the light reactions, where this oxidized carrier is reduced again with electrons from water.","description":"In linear electron flow, electrons taken from water pass through photosystem II and photosystem I. Which oxidized carrier in the stroma finally accepts them?","confusables":["coenzyme","cofactor"],"sourcePages":[84,91,92,96],"correction":null},{"word":"NADPH","pos":"molecule","definition":"reduced carrier made in the light reactions that supplies electrons to the Calvin cycle","contextSentence":"NADPH made in the light reactions supplies the electrons that reduce 3-phosphoglycerate to G3P in the Calvin cycle.","clozeSentence":"Cyclic electron flow makes ATP but none of the electron carrier ___ that the Calvin cycle uses to reduce 3-phosphoglycerate, so chloroplasts still need linear flow.","description":"A mutant chloroplast lacks working NADP+ reductase. Cyclic electron flow still makes some ATP, but the Calvin cycle cannot reduce 3-phosphoglycerate. Which electron-carrying light-reaction product is missing?","confusables":["coenzyme","cofactor"],"sourcePages":[77,84,91,92],"correction":null},{"word":"pyruvate","pos":"molecule","definition":"the 3-carbon end product of glycolysis; two form from each glucose","contextSentence":"When oxygen is available, pyruvate is transported into the mitochondrial matrix, where it loses CO2 and is converted to acetyl CoA.","clozeSentence":"Glycolysis splits one six-carbon glucose into two molecules of ___, a three-carbon compound that can enter the mitochondrion or be fermented.","description":"A drug blocks the transport protein that moves glycolysis's end product from the cytosol into the mitochondrial matrix. Which 3-carbon molecule can no longer reach the matrix to be oxidized?","confusables":[],"sourcePages":[59,60,63,68],"correction":null},{"word":"acetyl CoA","pos":"molecule","definition":"a 2-carbon acetyl group bound to coenzyme A that joins oxaloacetate to start the Krebs cycle","contextSentence":"Pyruvate oxidation releases one CO2, reduces NAD+ to NADH, and attaches the remaining two-carbon fragment to coenzyme A, forming acetyl CoA.","clozeSentence":"When oxaloacetate runs low, the Krebs cycle slows and ___ builds up in the matrix, because it needs oxaloacetate to form citrate.","description":"Fatty acids are cut into two-carbon units that enter the Krebs cycle by combining with oxaloacetate to make citrate. In what molecular form do these units enter?","confusables":[],"sourcePages":[60,67,68],"correction":null},{"word":"G3P","pos":"molecule","definition":"3-carbon sugar made in the Calvin cycle; two can be combined to build one glucose","contextSentence":"For every three CO2 fixed, the Calvin cycle makes six G3P, but only one leaves as net product while five are used to regenerate RuBP.","clozeSentence":"The three-carbon sugar that leaves the Calvin cycle, ___, is used by the plant to build glucose, sucrose and starch.","description":"Radioactive CO2 is fed to an illuminated leaf. After appearing in 3-phosphoglycerate, the label shows up in a 3-carbon sugar formed using ATP and NADPH and exported to make sucrose. What is this sugar?","confusables":[],"sourcePages":[1,84,91,94],"correction":"Notes said 'G3P (Glucose)'; correct: G3P is a 3-carbon sugar (glyceraldehyde-3-phosphate), and two G3P are needed to build one 6-carbon glucose."},{"word":"RuBP","pos":"molecule","definition":"5-carbon sugar that rubisco attaches CO2 to; regenerated each turn of the Calvin cycle","contextSentence":"Rubisco attaches CO2 to the five-carbon RuBP, forming an unstable six-carbon intermediate that splits into two 3-phosphoglycerate.","clozeSentence":"Five of every six G3P made in the Calvin cycle are rearranged, using ATP, to regenerate ___, the five-carbon CO2 acceptor.","description":"When a plant is moved from light to darkness, 3-phosphoglycerate briefly rises while the 5-carbon CO2 acceptor falls, since no ATP is available to regenerate it. Which molecule falls?","confusables":[],"sourcePages":[84,94,96],"correction":null},{"word":"lactate","pos":"molecule","definition":"3-carbon product formed when NADH reduces pyruvate, as in muscle fermentation","contextSentence":"During intense exercise, muscle cells short on oxygen reduce pyruvate to lactate, regenerating NAD+ so glycolysis can keep producing ATP.","clozeSentence":"Bacteria used to make yogurt convert pyruvate directly into ___, and no CO2 is released in this step.","description":"Blood drawn from a sprinter during an all-out run shows a sharp rise in a 3-carbon fermentation product whose formation releases no CO2. What molecule is it?","confusables":[],"sourcePages":[59,63,68,75],"correction":"Notes implied that lactic acid causes post-exercise muscle soreness; correct: lactate is cleared within hours, and delayed soreness comes mainly from small muscle injuries."},{"word":"ethanol","pos":"molecule","definition":"2-carbon alcohol formed when NADH reduces acetaldehyde in yeast fermentation","contextSentence":"In bread and wine making, yeast convert pyruvate to CO2 and acetaldehyde, which NADH then reduces to ethanol.","clozeSentence":"In alcohol fermentation, pyruvate first loses CO2, and the resulting acetaldehyde is reduced to ___ as NADH is oxidized to NAD+.","description":"Yeast in a sealed tank of grape juice run out of O2 and start releasing CO2 while a 2-carbon product builds up that eventually poisons them. What is this product?","confusables":[],"sourcePages":[59,63,68,75],"correction":null},{"word":"ATP synthase","pos":"molecule","definition":"membrane enzyme that uses H+ flowing down its gradient to make ATP from ADP and Pi","contextSentence":"In the inner mitochondrial membrane, ATP synthase lets H+ flow from the intermembrane space back into the matrix and uses that energy to phosphorylate ADP.","clozeSentence":"In the thylakoid membrane, protons flow from the lumen into the stroma through ___, which converts their potential energy into ATP.","description":"A chemical that makes the thylakoid membrane leaky to protons stops ATP production even though electron transport continues. Which enzyme has lost the gradient that powers it?","confusables":["enzyme"],"sourcePages":[55,61,62,63,65,77,84,92],"correction":null},{"word":"rubisco","pos":"molecule","definition":"the Calvin cycle enzyme that attaches CO2 to RuBP; it can also react with O2","contextSentence":"Rubisco, often called the most abundant protein on Earth, carries out carbon fixation by attaching CO2 to RuBP in the chloroplast stroma.","clozeSentence":"On hot, dry days, stomata close, O2 builds up inside the leaf, and ___ adds O2 to RuBP instead of CO2, starting photorespiration.","description":"In a sealed chamber with very little CO2 and high O2, a leaf's Calvin cycle enzyme attaches O2 to RuBP, so carbon is lost as CO2 instead of being fixed into sugar. Which enzyme does this?","confusables":["enzyme"],"sourcePages":[84,94,95],"correction":null},{"word":"chlorophyll a","pos":"molecule","definition":"main photosynthetic pigment; in reaction centers it passes excited electrons to an acceptor","contextSentence":"In photosystem II, a special pair of chlorophyll a molecules called P680 absorbs energy and passes an excited electron to the primary electron acceptor.","clozeSentence":"Only ___ molecules in the reaction center actually transfer excited electrons to the primary acceptor; accessory pigments just funnel energy to them.","description":"Light energy captured by carotenoids and other accessory pigments is funneled to a reaction center, where one pigment type loses an excited electron to the primary acceptor. Which pigment is it?","confusables":[],"sourcePages":[83,84,89,90],"correction":null},{"word":"chlorophyll b","pos":"molecule","definition":"a green accessory pigment that broadens light absorption and passes energy to the reaction center","contextSentence":"Chlorophyll b, an accessory pigment in light-harvesting complexes, absorbs some wavelengths that chlorophyll a absorbs poorly and passes the energy on.","clozeSentence":"In paper chromatography of spinach pigments, ___ forms the yellow-green band that travels just below the blue-green chlorophyll a band.","description":"A pale mutant plant still photosynthesizes but lacks a green accessory pigment, so it absorbs less light near 450 nm and grows more slowly in dim light. Which pigment is missing?","confusables":[],"sourcePages":[83,84,89,90],"correction":null},{"word":"carotenoids","pos":"molecule","definition":"yellow-orange accessory pigments that widen absorbed light and protect against excess light","contextSentence":"As chlorophyll breaks down in autumn, yellow and orange carotenoids, which were in the leaves all along, become visible.","clozeSentence":"Carotene and xanthophyll belong to the ___, accessory pigments that absorb blue-green light and protect chlorophyll from damage by excess light.","description":"A pigment extract absorbs strongly from about 400 to 500 nm, absorbs almost nothing in the red, and looks orange. Which class of plant pigments does it contain?","confusables":[],"sourcePages":[84,89,90],"correction":null},{"word":"oxygen","pos":"molecule","definition":"O2; released when water is split in photosynthesis and reduced to water at the end of the ETC","contextSentence":"In aerobic respiration, oxygen picks up electrons at the end of the electron transport chain and combines with H+ to form water.","clozeSentence":"The ___ gas released by plants during photosynthesis comes from splitting water molecules, not from the carbon dioxide they absorb.","description":"A poison blocks the last protein complex of the mitochondrial electron transport chain, and ATP production collapses. Which molecule can no longer receive electrons and be reduced to water?","confusables":["final electron acceptor"],"sourcePages":[52,59,61,63,73,84],"correction":null},{"word":"cellular respiration","pos":"process","definition":"catabolic process that breaks down organic fuel to make ATP, giving CO2 and H2O when aerobic","contextSentence":"Plant cells carry out cellular respiration in their mitochondria day and night, breaking down sugars made in photosynthesis to produce ATP.","clozeSentence":"During aerobic ___, one glucose molecule is fully oxidized to 6 CO2 and 6 H2O, capturing part of the released energy as about 30-32 ATP.","description":"A germinating seed kept in the dark takes in O2, gives off CO2, and steadily loses dry mass as its stored starch is used to make ATP. What overall process is it performing?","confusables":[],"sourcePages":[1,51,52,66,67,68],"correction":"Notes said aerobic respiration yields 36-38 ATP per glucose; correct: that is an older estimate, and current estimates are about 30-32 ATP per glucose."},{"word":"glycolysis","pos":"process","definition":"cytosolic pathway that splits glucose into two pyruvate, netting 2 ATP and 2 NADH","contextSentence":"Glycolysis happens in the cytosol of nearly every organism, which suggests it evolved early, before O2 was abundant in Earth's atmosphere.","clozeSentence":"During ___, a six-carbon glucose is split into two three-carbon pyruvate molecules in the cytosol, with a net gain of 2 ATP and 2 NADH.","description":"A glucose look-alike binds hexokinase but cannot be processed further. Which stage of energy harvest, shared by both fermentation and aerobic respiration, does it most directly block?","confusables":[],"sourcePages":[6,59,60,67,70],"correction":null},{"word":"pyruvate oxidation","pos":"process","definition":"conversion of pyruvate to acetyl CoA in the matrix, releasing CO2 and making NADH","contextSentence":"In pyruvate oxidation, each pyruvate entering the mitochondrial matrix loses one carbon as CO2, and the remaining two carbons are attached to coenzyme A.","clozeSentence":"The linking step called ___ connects glycolysis to the Krebs cycle by turning each three-carbon pyruvate into two-carbon acetyl CoA.","description":"Researchers label one carbon of the three-carbon product of glycolysis and find it leaves the mitochondrion as CO2 before the Krebs cycle even begins. Which step released it?","confusables":["oxidation"],"sourcePages":[60,67,68],"correction":null},{"word":"Krebs cycle","pos":"process","definition":"cycle in the matrix that oxidizes acetyl CoA to CO2, making NADH, FADH2 and a little ATP","contextSentence":"Malonate slows the Krebs cycle by competitively inhibiting succinate dehydrogenase, the enzyme that converts succinate to fumarate.","clozeSentence":"In the ___, acetyl CoA combines with oxaloacetate to form citrate, and the cycle regenerates oxaloacetate with each turn.","description":"Mitochondria running low on oxaloacetate build up acetyl CoA and make fewer FADH2 molecules and less CO2. Which stage of respiration has slowed?","confusables":[],"sourcePages":[60,66,67,71],"correction":null},{"word":"electron transport chain","pos":"process","definition":"membrane proteins that pass electrons in redox steps and use the energy to pump H+","contextSentence":"In mitochondria, the electron transport chain accepts electrons from NADH and FADH2 and uses their energy to pump H+ into the intermembrane space.","clozeSentence":"Proteins of the ___, embedded in the inner mitochondrial membrane, pass electrons from NADH toward O2, releasing energy in small steps instead of all at once.","description":"Rotenone blocks Complex I, so electrons from NADH cannot move toward O2; proton pumping stops and NADH piles up. What system of membrane proteins has been blocked?","confusables":["oxidative phosphorylation"],"sourcePages":[56,57,61,62,63],"correction":"Notes said Complexes I, II, III and IV all pump protons; correct: only Complexes I, III and IV pump protons, and Complex II does not."},{"word":"oxidative phosphorylation","pos":"process","definition":"ATP synthesis driven by electron transport to O2 and the resulting H+ flow through ATP synthase","contextSentence":"Oxidative phosphorylation makes most of a cell's ATP, about 26-28 per glucose, as H+ flows back through ATP synthase into the matrix.","clozeSentence":"Making about 26-28 ATP per glucose, ___ produces most of the ATP in aerobic respiration, using electrons from NADH and FADH2.","description":"In brown fat, UCP-1 lets H+ leak back into the matrix without passing through ATP synthase, so O2 use continues but heat is released instead. Which mitochondrial ATP-making process is uncoupled?","confusables":["chemiosmosis","electron transport chain","phosphorylation"],"sourcePages":[57,61,65,67],"correction":"Notes said oxidative phosphorylation makes 32-34 ATP per glucose; correct: current estimates are about 26-28 ATP, for a total of about 30-32 ATP per glucose."},{"word":"chemiosmosis","pos":"process","definition":"H+ diffusing down its gradient across a membrane through ATP synthase, powering ATP synthesis","contextSentence":"Damage that makes the inner mitochondrial membrane leaky to H+ halts chemiosmosis, because no proton gradient remains to drive ATP synthase.","clozeSentence":"In both mitochondria and chloroplasts, ATP is made by ___, the flow of H+ down its gradient through ATP synthase.","description":"Isolated thylakoids are soaked in an acidic pH 4 solution in the dark, then moved to a pH 8 buffer with ADP and Pi, and they make ATP with no light at all. What process explains this?","confusables":["oxidative phosphorylation","photophosphorylation"],"sourcePages":[57,61,62,92],"correction":"Notes said ATP synthesis is driven by hydrogen atoms dropped off by NADH and FADH2; correct: NADH and FADH2 deliver electrons, and it is the H+ ions pumped by the electron transport chain that flow through ATP synthase."},{"word":"substrate-level phosphorylation","pos":"process","definition":"ATP made when an enzyme transfers a phosphate from a substrate directly to ADP","contextSentence":"Glycolysis makes its ATP by substrate-level phosphorylation, so it still works without O2 or any proton gradient.","clozeSentence":"In the Krebs cycle, converting succinyl CoA to succinate makes one GTP or ATP per turn by ___, with no ATP synthase involved.","description":"Even after a drug collapses every proton gradient in a cell, kinases still make some ATP by moving a phosphate from an intermediate such as PEP straight onto ADP. What is this mechanism called?","confusables":["phosphorylation"],"sourcePages":[57,60,67],"correction":null},{"word":"fermentation","pos":"process","definition":"regenerating NAD+ without O2 by giving NADH's electrons to pyruvate or a molecule made from it","contextSentence":"Yogurt, cheese, bread and wine all depend on fermentation by microbes that make ATP only through glycolysis.","clozeSentence":"Whether it ends in lactate or ethanol, ___ lets glycolysis continue without O2 by recycling NAD+ from NADH.","description":"Without O2 or any other inorganic electron acceptor, a bacterium makes ATP only by glycolysis and passes the electrons from NADH onto an organic molecule. What general process is this?","confusables":["alcohol fermentation","lactic acid fermentation"],"sourcePages":[59,63,68,75],"correction":"Notes called fermentation a form of anaerobic respiration; correct: anaerobic respiration uses an electron transport chain with a non-O2 final electron acceptor, while fermentation uses no electron transport chain and passes NADH's electrons to an organic molecule."},{"word":"lactic acid fermentation","pos":"process","definition":"NADH reduces pyruvate directly to lactate, regenerating NAD+ with no CO2 released","contextSentence":"During a sprint, muscle cells short on O2 use lactic acid fermentation to regenerate NAD+ so glycolysis can keep supplying ATP.","clozeSentence":"Bacteria used to make yogurt carry out ___, in which NADH reduces pyruvate to lactate and no CO2 is given off.","description":"A microbe grown without O2 converts each glucose into two three-carbon acid molecules and releases no gas. Which pathway is it using to recycle NAD+?","confusables":["fermentation"],"sourcePages":[59,68,75],"correction":"Notes implied that lactic acid causes post-exercise muscle soreness; correct: lactate is cleared within hours, and delayed soreness comes mainly from small muscle injuries."},{"word":"alcohol fermentation","pos":"process","definition":"pyruvate loses CO2 to form acetaldehyde, which NADH reduces to ethanol","contextSentence":"Bread dough rises because yeast performing alcohol fermentation release CO2 bubbles, and the ethanol they make evaporates during baking.","clozeSentence":"In ___, yeast remove CO2 from pyruvate to form acetaldehyde, which NADH then reduces to ethanol, regenerating NAD+.","description":"A sealed flask of grape juice and yeast with no O2 slowly builds up gas pressure, and the liquid becomes intoxicating. Which pathway is regenerating the yeast's NAD+?","confusables":["fermentation"],"sourcePages":[59,68,75],"correction":null},{"word":"oxidation","pos":"process","definition":"loss of electrons by an atom or molecule, often along with H atoms","contextSentence":"In cellular respiration, the stepwise oxidation of glucose to CO2 releases energy that is captured in NADH, FADH2 and ATP.","clozeSentence":"When sodium reacts with chlorine to form NaCl, sodium undergoes ___ because it gives up an electron to chlorine.","description":"A dehydrogenase removes two electrons and two H+ from a food molecule and passes the electrons to NAD+. What chemical change has the food molecule undergone?","confusables":["pyruvate oxidation","redox reaction"],"sourcePages":[52,58,67],"correction":null},{"word":"reduction","pos":"process","definition":"gain of electrons by an atom or molecule","contextSentence":"In the Calvin cycle's reduction phase, NADPH donates electrons to 3-phosphoglycerate, converting it into the higher-energy sugar G3P.","clozeSentence":"At the end of the respiratory ETC, O2 undergoes ___ as it gains electrons and picks up H+ to become water.","description":"In the reaction NAD+ + 2 e- + H+ -> NADH, what chemical change is NAD+ undergoing?","confusables":["redox reaction"],"sourcePages":[52,58,67,94],"correction":null},{"word":"phosphorylation","pos":"process","definition":"adding a phosphate group to a molecule, often making it more reactive","contextSentence":"Hexokinase begins glycolysis with the phosphorylation of glucose, using a phosphate from ATP to form glucose-6-phosphate.","clozeSentence":"Many proteins are switched on or off by ___, in which a kinase attaches a phosphate group taken from ATP.","description":"When glutamine synthesis is coupled to ATP, glutamic acid first receives a phosphate group from ATP and becomes a less stable, reactive intermediate. What is this transfer step called?","confusables":["ATP hydrolysis","energy coupling","oxidative phosphorylation","photophosphorylation","substrate-level phosphorylation"],"sourcePages":[7,8,21,57],"correction":null},{"word":"ATP hydrolysis","pos":"process","definition":"splitting ATP with water into ADP and Pi, releasing free energy (about -7.3 kcal/mol)","contextSentence":"Muscle contraction is powered by ATP hydrolysis, which releases about 7.3 kcal/mol of free energy as ATP becomes ADP and inorganic phosphate.","clozeSentence":"Glutamine synthesis (ΔG = +3.4 kcal/mol) becomes spontaneous when coupled to ___, giving an overall ΔG of about -3.9 kcal/mol.","description":"A reaction with ΔG = +3.4 kcal/mol occurs in a cell only when paired with a second reaction that has ΔG = -7.3 kcal/mol and produces ADP and Pi. What is that second reaction?","confusables":["phosphorylation"],"sourcePages":[7,8,48],"correction":"Notes said ΔG = −7.3 kcal/mol is the energy of phosphorylation; correct: it is the free energy released by hydrolysis of ATP to ADP + Pi, which drives the phosphorylation."},{"word":"photosynthesis","pos":"process","definition":"using light energy to build sugar from CO2 and H2O, releasing O2","contextSentence":"Ancient cyanobacteria performing photosynthesis released the O2 that began building up in Earth's atmosphere about 2.3-2.5 billion years ago.","clozeSentence":"Because its products have more free energy than its reactants, ___ is endergonic, with light supplying the energy to build glucose from CO2 and water.","description":"The sea slug Elysia chlorotica keeps chloroplasts from the algae it eats and can grow in light with no other food. Which overall process do those chloroplasts carry out to turn light, CO2 and water into sugar for the slug?","confusables":[],"sourcePages":[1,77,78,84,88],"correction":"Notes said the exergonic graph has +ΔG and the endergonic graph has −ΔG; correct: exergonic reactions have negative ΔG, and endergonic ones such as photosynthesis have positive ΔG."},{"word":"light-dependent reactions","pos":"process","definition":"thylakoid membrane reactions that use light and water to make ATP, NADPH and O2","contextSentence":"In the thylakoid membranes, the light-dependent reactions convert light energy into the ATP and NADPH that the Calvin cycle needs.","clozeSentence":"Inputs of the ___ are light, H2O, ADP + Pi and NADP+, and their outputs are O2, ATP and NADPH.","description":"A herbicide blocks electron flow between the two photosystems in chloroplasts; ATP and NADPH production stop, and the Calvin cycle soon halts too. Which of the two main stages of photosynthesis was directly blocked?","confusables":["photolysis","photophosphorylation"],"sourcePages":[77,84,87,91,92],"correction":null},{"word":"Calvin cycle","pos":"process","definition":"stroma reactions that use ATP and NADPH to turn CO2 into the 3-carbon sugar G3P","contextSentence":"The Calvin cycle uses no light directly, but it stops in darkness once the ATP and NADPH from the light reactions run out.","clozeSentence":"Each G3P made in the ___ costs 9 ATP and 6 NADPH, which is why chloroplasts sometimes use cyclic electron flow for extra ATP.","description":"Algae are given radioactive CO2, and within seconds the label appears in 3-phosphoglycerate and then G3P in the stroma. Which stage of photosynthesis is being traced?","confusables":["carbon fixation"],"sourcePages":[84,87,91,94],"correction":null},{"word":"carbon fixation","pos":"process","definition":"incorporating inorganic CO2 into an organic molecule, as rubisco does with RuBP","contextSentence":"Rubisco catalyzes carbon fixation by attaching CO2 to the five-carbon sugar RuBP, forming an unstable intermediate that splits into two 3-phosphoglycerate.","clozeSentence":"The first phase of the Calvin cycle, ___, joins CO2 to RuBP and is followed by reduction and regeneration of RuBP.","description":"Plants grown in CO2-enriched air often grow faster because rubisco attaches CO2 to RuBP more often. Which Calvin cycle step is directly sped up?","confusables":["Calvin cycle"],"sourcePages":[79,84,94],"correction":null},{"word":"photolysis","pos":"process","definition":"splitting of water in the light reactions, giving electrons to PSII and releasing O2 and H+","contextSentence":"Photolysis of water inside the thylakoid lumen replaces the electrons lost by photosystem II and releases O2 as a by-product.","clozeSentence":"Experiments with labeled water showed that the O2 plants release comes from ___, the splitting of H2O, rather than from CO2.","description":"Plants given water containing the heavy isotope O-18 release O2 containing O-18, but plants given CO2 labeled with O-18 do not. Which step produces the O2 that plants release?","confusables":["light-dependent reactions"],"sourcePages":[84,85,92],"correction":null},{"word":"photophosphorylation","pos":"process","definition":"making ATP with light energy, using the H+ gradient built across the thylakoid membrane","contextSentence":"In chloroplasts, photophosphorylation uses the H+ gradient built by light-driven electron flow to make ATP through ATP synthase.","clozeSentence":"Light-driven ATP synthesis in chloroplasts is called ___, which sets it apart from oxidative ATP synthesis in mitochondria.","description":"Isolated thylakoids make ATP only while illuminated, and the ATP output stops when a chemical makes their membranes leaky to H+. What is this light-powered ATP production called?","confusables":["chemiosmosis","cyclic electron flow","light-dependent reactions","phosphorylation"],"sourcePages":[92,93],"correction":null},{"word":"cyclic electron flow","pos":"process","definition":"electrons from photosystem I loop back through the cytochrome complex, making ATP but no NADPH","contextSentence":"Cyclic electron flow uses only photosystem I and supplies extra ATP, because the Calvin cycle consumes more ATP than NADPH.","clozeSentence":"During ___, excited electrons pass from ferredoxin back to the cytochrome complex, so no water is split and no O2 is released.","description":"A mutant chloroplast lacking photosystem II still makes some ATP in light but produces no NADPH and releases no O2. What route of electron movement accounts for its ATP?","confusables":["photophosphorylation"],"sourcePages":[93],"correction":null},{"word":"photorespiration","pos":"process","definition":"rubisco adding O2 instead of CO2 to RuBP, using energy and releasing CO2 without making sugar","contextSentence":"C4 and CAM plants limit photorespiration by keeping CO2 concentrated around rubisco, an advantage in hot, dry climates.","clozeSentence":"When rubisco binds O2 instead of CO2, ___ uses up ATP and releases CO2 without producing any sugar.","description":"On a hot, dry afternoon a plant closes its stomata; O2 builds up in the leaf, CO2 falls, and sugar output drops even though light is plentiful. What wasteful process explains this?","confusables":[],"sourcePages":[85],"correction":null},{"word":"active site","pos":"structure","definition":"pocket on an enzyme whose shape and charge fit the substrate, where catalysis occurs","contextSentence":"Salivary amylase's active site is polar, so it attracts the polar starch amylose and helps hydrolyze it into smaller sugars.","clozeSentence":"The competitive inhibitor malonate fits into the ___ of succinate dehydrogenase, blocking succinate from binding there.","description":"Methanol and ethanol both bind alcohol dehydrogenase, and raising the ethanol concentration reduces methanol's effect. Where on the enzyme are the two molecules competing?","confusables":[],"sourcePages":[9,11,12,21,30,41],"correction":null},{"word":"allosteric site","pos":"structure","definition":"regulatory binding site away from the catalytic site; binding there changes enzyme shape","contextSentence":"Isoleucine binds the allosteric site of threonine deaminase, changing the enzyme's shape so threonine can no longer bind well.","clozeSentence":"AMP activates some multi-subunit enzymes by binding a regulatory ___ located away from where the substrate binds.","description":"A molecule lowers an enzyme's maximum rate, and adding huge amounts of substrate does not restore activity. Where on the enzyme is this inhibitor most likely bound?","confusables":[],"sourcePages":[9,30,39,40,41],"correction":null},{"word":"mitochondrial matrix","pos":"structure","definition":"fluid enclosed by the inner membrane of a mitochondrion, site of the Krebs cycle","contextSentence":"Acetyl CoA builds up in the mitochondrial matrix when the citric acid cycle that runs there is blocked.","clozeSentence":"Most Krebs cycle enzymes are dissolved in the ___, which has a lower H+ concentration than the intermembrane space.","description":"Radioactive pyruvate is fed to isolated mitochondria, and labeled CO2 is first produced in the compartment enclosed by the innermost membrane. What is this compartment?","confusables":[],"sourcePages":[57,60,61,67,71],"correction":null},{"word":"intermembrane space","pos":"structure","definition":"narrow region between a mitochondrion's two membranes, where pumped H+ accumulates","contextSentence":"As the ETC pumps H+ into the intermembrane space, its pH drops below that of the matrix, storing potential energy as a gradient.","clozeSentence":"Protons pumped by Complexes I, III and IV collect in the ___, then flow back into the matrix through ATP synthase.","description":"Scientists measuring pH in actively respiring mitochondria find that the region between the outer and inner membranes is more acidic than the interior. Which compartment is this?","confusables":[],"sourcePages":[57,61,62,65],"correction":"Notes said ETC proteins are contained in the intermembrane space; correct: they are embedded in the inner mitochondrial membrane and pump H+ into the intermembrane space."},{"word":"inner mitochondrial membrane","pos":"structure","definition":"membrane holding the ETC and ATP synthase, across which the H+ gradient forms","contextSentence":"Damage that makes the inner mitochondrial membrane leaky to H+ abolishes ATP synthesis, even though electron transport keeps running.","clozeSentence":"Unlike the outer membrane, the ___ is nearly impermeable to H+, so it can hold the proton gradient that drives ATP synthase.","description":"A toxin makes one of the two mitochondrial membranes leaky to H+, and ATP synthesis collapses while O2 use continues. Which membrane was damaged?","confusables":["cristae"],"sourcePages":[57,61,63,65],"correction":null},{"word":"cristae","pos":"structure","definition":"infoldings of the inner mitochondrial membrane that increase its surface area","contextSentence":"Heart muscle mitochondria have densely packed cristae, giving them more membrane area for ETC proteins and ATP synthase.","clozeSentence":"The many folds called ___ give the inner mitochondrial membrane a large surface area for electron transport and ATP synthesis.","description":"Electron micrographs show that mitochondria in insect flight muscle have far more inner-membrane folds than those in less active cells. What are these folds called?","confusables":["inner mitochondrial membrane"],"sourcePages":[],"correction":null},{"word":"chloroplast","pos":"structure","definition":"double-membrane organelle that captures light energy and makes sugar","contextSentence":"Chloroplasts are thought to descend from engulfed cyanobacteria, which helps explain their double membrane and photosynthetic machinery.","clozeSentence":"In plant cells, the ___ contains stacked thylakoids surrounded by fluid stroma and carries out photosynthesis.","description":"A sea slug keeps a green organelle taken from the algae it eats inside its own cells and can then survive in light without eating. What organelle is it keeping?","confusables":[],"sourcePages":[77,80,84,86,88],"correction":null},{"word":"thylakoid","pos":"structure","definition":"flattened membrane sac in a chloroplast holding the photosystems, ETC and ATP synthase","contextSentence":"Each thylakoid membrane holds photosystem II, an electron transport chain, photosystem I and ATP synthase, where the light reactions take place.","clozeSentence":"Grana are stacks of ___ sacs, whose membranes hold the chlorophyll that absorbs light energy.","description":"When channels that let H+ pass freely are inserted into the membranes of the flattened sacs inside chloroplasts, ATP synthesis stops. What are these sacs called?","confusables":["granum","thylakoid lumen"],"sourcePages":[79,84,86,91],"correction":null},{"word":"thylakoid lumen","pos":"structure","definition":"fluid-filled space inside a thylakoid where H+ builds up during the light reactions","contextSentence":"Water splitting and proton pumping both add H+ to the thylakoid lumen, making it far more acidic than the stroma.","clozeSentence":"In chloroplasts, H+ flows from the ___ through ATP synthase out into the stroma, driving ATP synthesis.","description":"In a chloroplast in bright light, which compartment has the lowest pH because water splitting and electron transport both load it with H+?","confusables":["thylakoid"],"sourcePages":[85,86,92],"correction":null},{"word":"stroma","pos":"structure","definition":"the fluid inside a chloroplast, around the thylakoids, where the Calvin cycle runs","contextSentence":"Rubisco attaches CO2 to RuBP in the stroma, using the ATP and NADPH released from the thylakoid membranes into the surrounding fluid.","clozeSentence":"In a chloroplast, the Calvin cycle enzymes are dissolved in the ___, the fluid that surrounds the thylakoid stacks.","description":"Chloroplasts are broken open and separated into a membrane fraction and a fluid fraction. Only the fluid fraction can turn CO2 into G3P when given ATP and NADPH. Which part of the chloroplast did that fluid come from?","confusables":[],"sourcePages":[79,84,87,91],"correction":null},{"word":"granum","pos":"structure","definition":"a stack of flattened thylakoid discs inside a chloroplast","contextSentence":"In electron micrographs of a leaf cell, each granum looks like a stack of coins built from flattened thylakoid sacs that hold the photosystems.","clozeSentence":"Each ___, a pile of flattened thylakoid discs, packs a large area of light-absorbing membrane into a small part of the chloroplast.","description":"Under an electron microscope, a chloroplast shows piles of flattened membrane discs that look like stacks of coins, joined to one another by thin membrane bridges. What is one of these piles called?","confusables":["thylakoid"],"sourcePages":[79,84,87,91],"correction":null},{"word":"photosystem II","pos":"structure","definition":"the P680 light-harvesting complex whose lost electrons are replaced by splitting water","contextSentence":"In linear electron flow, photosystem II absorbs light first, and its excited electrons travel through plastoquinone and the cytochrome complex toward the other photosystem.","clozeSentence":"Water is split to replace electrons lost by ___, the P680-containing complex, which is why this complex is the source of the O2 plants release.","description":"A mutant alga in light still makes some ATP by cyclic electron flow, but it releases no O2 and makes no NADPH. Its P700 reaction center works normally. Which light-harvesting complex is most likely defective?","confusables":[],"sourcePages":[79,84,85,92,93],"correction":null},{"word":"photosystem I","pos":"structure","definition":"the P700 light-harvesting complex that re-energizes electrons and passes them on to make NADPH","contextSentence":"During cyclic electron flow only photosystem I is used, so electrons loop back to the cytochrome complex and the chloroplast makes ATP without NADPH or O2.","clozeSentence":"After passing through plastocyanin, electrons are boosted by light a second time at ___, then handed via ferredoxin to NADP+ reductase.","description":"In a mutant chloroplast, water is split and electrons travel all the way to plastocyanin, but they are never re-energized by light and NADP+ is never reduced. Which complex has most likely failed?","confusables":[],"sourcePages":[79,84,85,92,93],"correction":null},{"word":"stomata","pos":"structure","definition":"pores in a leaf's surface that let CO2 in and let O2 and water vapor out","contextSentence":"On hot, dry afternoons many plants close their stomata to save water, which also cuts off CO2 entry and can lead to photorespiration.","clozeSentence":"Carbon dioxide reaches the mesophyll by diffusing in through ___, small leaf openings that can widen or narrow during the day.","description":"A biologist coats the underside of a plant's leaves with petroleum jelly. Within hours the leaves take up far less CO2 and lose far less water vapor, even in bright light. What openings were most likely sealed?","confusables":[],"sourcePages":[79,84,86],"correction":null},{"word":"guard cell","pos":"structure","definition":"one of a pair of cells that change shape to open or close a leaf pore","contextSentence":"When a guard cell takes up water and swells, it bows outward along with its partner, opening a stoma so CO2 can diffuse into the leaf.","clozeSentence":"A stoma opens when the ___ on each side of it fills with water and bends outward, and it closes when that cell loses water.","description":"During a drought, water moves out of the two curved cells that border each leaf pore; they go limp, the pore shuts, and CO2 uptake drops. What are these cells called?","confusables":[],"sourcePages":[86,87],"correction":null},{"word":"metabolism","pos":"concept","definition":"the total of all chemical reactions that take place in an organism","contextSentence":"A cell's metabolism includes catabolic pathways such as cellular respiration and anabolic pathways such as protein synthesis, each step catalyzed by an enzyme.","clozeSentence":"The ___ of a cell covers every one of its chemical reactions, both those that break molecules down and those that build them up.","description":"A liver cell is breaking glucose down to CO2 while also joining amino acids into proteins and building glycogen. What single term covers all of these chemical reactions together?","confusables":[],"sourcePages":[4,70],"correction":null},{"word":"first law of thermodynamics","pos":"concept","definition":"energy can be transferred or transformed, but never created or destroyed","contextSentence":"By the first law of thermodynamics, light energy captured by grass is not destroyed; it becomes chemical energy in sugars and, eventually, heat in consumers.","clozeSentence":"According to the ___, a moving car does not create energy; it converts chemical energy in gasoline into motion and heat, with the total unchanged.","description":"A student says a muscle 'makes' energy when it contracts. The teacher replies that the muscle only converts chemical energy from ATP into motion and heat, and the total amount stays the same. Which principle is the teacher using?","confusables":[],"sourcePages":[5,48],"correction":null},{"word":"second law of thermodynamics","pos":"concept","definition":"every energy transfer or transformation increases the disorder of the universe","contextSentence":"Cells stay highly ordered without violating the second law of thermodynamics, because the heat they release increases disorder in their surroundings.","clozeSentence":"Because of the ___, every energy transfer in a food chain turns some energy into heat, so energy flows through ecosystems instead of cycling.","description":"A plant builds highly ordered sugars from simple CO2 and water, yet the combined system of plant, surroundings and Sun still becomes more disordered overall. Which principle requires this overall increase?","confusables":[],"sourcePages":[5,48],"correction":"Notes said photosynthesis obeys the second law because an ecosystem forms from organisms interacting with their environment; correct: it obeys the law because the total system of organisms plus the Sun still becomes more disordered."},{"word":"entropy","pos":"concept","definition":"a measure of the disorder or randomness of a system","contextSentence":"When a car burns gasoline, heat, CO2 and exhaust spread out into the air, increasing the entropy of the surroundings.","clozeSentence":"Living things keep their internal order only by taking in energy, and the heat they release raises the ___ of their surroundings.","description":"An ice cube melts on a warm counter, and its water molecules go from a fixed crystal pattern to moving about randomly. Which quantity describing molecular disorder has increased?","confusables":[],"sourcePages":[5,48],"correction":null},{"word":"free energy","pos":"concept","definition":"the part of a system's energy that is available to do work","contextSentence":"In an exergonic reaction such as ATP hydrolysis, the products have less free energy than the reactants, so ΔG is negative and the reaction is spontaneous.","clozeSentence":"A reaction is endergonic when its products hold more ___ than its reactants, giving a positive ΔG that must be paid for with an energy input.","description":"Glucose plus O2 can be used to power cellular work, but the CO2 and H2O left after respiration cannot. What quantity is much higher in the reactants than in the products?","confusables":[],"sourcePages":[5,6,48,88],"correction":"Notes said the exergonic graph has +ΔG and the endergonic graph has −ΔG; correct: exergonic reactions have negative ΔG (products hold less free energy), and endergonic ones have positive ΔG."},{"word":"activation energy","pos":"concept","definition":"the energy reactants must absorb to reach the transition state and react","contextSentence":"Glucose in air does not burst into flame because its activation energy is high; enzymes lower this barrier so sugar is oxidized in controlled steps.","clozeSentence":"Enzymes speed up reactions by lowering the ___, the energy barrier reactants must get over, without changing the reaction's ΔG.","description":"Hydrogen peroxide is energetically favored to break down, yet it decomposes very slowly until catalase is added, which speeds it up enormously without changing ΔG. What energy barrier does catalase reduce?","confusables":[],"sourcePages":[11,15,19,21,51,88],"correction":null},{"word":"energy coupling","pos":"concept","definition":"using the energy released by an exergonic reaction to drive an endergonic one","contextSentence":"Making glutamine (ΔG = +3.4 kcal/mol) works in cells through energy coupling with ATP hydrolysis, giving an overall ΔG of −3.9 kcal/mol.","clozeSentence":"Through ___, the free energy released by one reaction is used to drive a separate reaction that could not proceed on its own.","description":"A cell must join two amino acids, a step with a positive ΔG. It links this step to ATP hydrolysis through a phosphorylated intermediate, so the overall ΔG becomes negative. What is this strategy called?","confusables":["phosphorylation"],"sourcePages":[7,8,15,48],"correction":"Notes said ΔG = −7.3 kcal/mol is the energy associated with phosphorylation; correct: −7.3 kcal/mol is the free energy released by hydrolyzing ATP to ADP + Pi, which is what drives the coupled reaction."},{"word":"transition state","pos":"concept","definition":"the unstable, highest-energy arrangement of atoms while bonds break and form","contextSentence":"Catalase's active site binds and stabilizes the transition state, so hydrogen peroxide needs much less energy input to break apart into water and oxygen.","clozeSentence":"The peak of a reaction's energy diagram marks the ___, a strained, unstable arrangement that reactants must pass through before becoming products.","description":"A metal key ring must be bent open into a strained, unstable shape before a key can slide on, and then it snaps back to a stable shape. In this analogy for a reaction, what does the bent-open ring represent?","confusables":[],"sourcePages":[11,15,19,21],"correction":null},{"word":"induced fit","pos":"concept","definition":"an enzyme's slight change in shape as substrate binds, so it grips the substrate snugly","contextSentence":"When glucose enters hexokinase's active site, induced fit closes the enzyme around it, positioning glucose to receive a phosphate from ATP.","clozeSentence":"Unlike the rigid lock-and-key analogy, the ___ model says the active site changes shape slightly as substrate binds, like a clasping handshake.","description":"Water can enter hexokinase's active site, but it does not trigger the shape change that glucose does, so ATP is not wastefully hydrolyzed. Which model of enzyme-substrate binding explains this?","confusables":[],"sourcePages":[9,21,33],"correction":null},{"word":"enzyme specificity","pos":"concept","definition":"a catalyst acting only on substrates whose shape and charge match its active site","contextSentence":"Sucrase hydrolyzes sucrose but not lactose, an example of enzyme specificity that comes from the complementary shape and charge of its active site.","clozeSentence":"Salivary amylase's polar active site binds polar amylose but not unrelated molecules, an example of ___, which depends on matching shape and chemistry.","description":"Lactase breaks down lactose but has no effect on sucrose, even though both are disaccharides made of two simple sugars. What property of the enzyme explains this?","confusables":[],"sourcePages":[11,12,15,21],"correction":null},{"word":"denaturation","pos":"concept","definition":"loss of a protein's 3-D shape, and therefore its function, due to heat, pH or chemicals","contextSentence":"Boiling catalase causes denaturation, so filter-paper disks soaked in it release almost no oxygen and fail to float in hydrogen peroxide.","clozeSentence":"Pepsin carried into the basic small intestine undergoes ___, as changed R-group charges disrupt the interactions that hold its active site in shape.","description":"Lactase heated to 80 °C and then cooled back to 37 °C stays much less active than lactase that was never heated. What happened to the heated enzyme?","confusables":[],"sourcePages":[9,13,16,24,25,26,28,43],"correction":"Notes said an enzyme loses its shape as more H+ ions interfere; correct: that explains only low pH, because at high pH the loss of H+ from R groups also changes their charges and disrupts the shape."},{"word":"optimal temperature","pos":"concept","definition":"the temperature at which an enzyme's reaction rate is highest","contextSentence":"Enzymes from hot-spring bacteria have an optimal temperature near 77 °C, far above the roughly 37 °C typical of human enzymes.","clozeSentence":"Below its ___, an enzyme works slowly because molecules collide less often; above it, the enzyme starts to denature and the rate drops sharply.","description":"Salivary amylase digests starch slowly at 25 °C and slowly again at 55 °C, but much faster at about 37 °C. What does 37 °C represent for this enzyme?","confusables":[],"sourcePages":[26,28,33,43,95],"correction":null},{"word":"optimal pH","pos":"concept","definition":"the pH at which an enzyme's activity is highest","contextSentence":"Pepsin has an optimal pH near 2, matching the acidic stomach, while trypsin works best near pH 8 in the small intestine.","clozeSentence":"An enzyme that works inside lysosomes, where the fluid is about pH 4.5, most likely has its ___ near 4.5 as well.","description":"Polyphenol oxidase from apples browns catechol fastest at pH 7, more slowly at pH 5 and 9, and barely at all at pH 1 or 11. What does pH 7 represent for this enzyme?","confusables":[],"sourcePages":[13,24,25,31,32,34,35,43],"correction":"Notes said a basic (high-pH) environment makes a protein more folded and stable; correct: a protein is most stable near its own optimal pH, and both very high and very low pH disrupt its folding."},{"word":"saturation","pos":"concept","definition":"the state in which all active sites are occupied, so more substrate can't raise the rate","contextSentence":"At high lactose concentrations lactase reaches saturation, so the reaction rate levels off at its maximum value, Vmax.","clozeSentence":"Once every active site is occupied, the enzyme is at ___, and only adding more enzyme, not more substrate, will speed up product formation.","description":"Raising substrate from 10 to 50 mM triples an enzyme's reaction rate, but raising it from 500 to 1000 mM barely changes the rate. What state has the enzyme reached at high substrate levels?","confusables":[],"sourcePages":[26,27,36,39,44],"correction":"Notes said doubling lactase at a high lactose concentration leaves the rate unchanged; correct: the rate increases, because more active sites become available to the excess substrate."},{"word":"feedback inhibition","pos":"concept","definition":"a pathway's end product switching off an enzyme that acts early in that pathway","contextSentence":"In feedback inhibition, isoleucine binds an allosteric site on threonine deaminase, the first enzyme in its pathway, slowing its own synthesis.","clozeSentence":"Through ___, a pathway's own final product shuts down the pathway's first enzyme, so the cell stops wasting energy on product it does not need.","description":"In a pathway W → X → Y → Z, adding extra Z to the cells makes X and Y stop building up within minutes, and the W-to-X enzyme shows reduced activity. What control mechanism is at work?","confusables":["allosteric regulation"],"sourcePages":[39,40,41],"correction":"Notes said feedback inhibition is an example of allosteric activation; correct: it is allosteric inhibition, because the end product switches an early enzyme off."},{"word":"allosteric regulation","pos":"concept","definition":"control of a protein's activity by a molecule binding at a site other than the active site","contextSentence":"AMP binding to phosphofructokinase, a multi-subunit glycolysis enzyme, is allosteric regulation that speeds glycolysis when the cell's ATP runs low.","clozeSentence":"In ___, a regulatory molecule binding at a separate site changes an enzyme's shape and can either activate or inhibit it.","description":"A molecule binds a multi-subunit enzyme far from its active site and holds the active site in a shape that binds substrate well, raising activity. What general type of enzyme control is this?","confusables":["feedback inhibition"],"sourcePages":[39,40,41],"correction":null},{"word":"redox reaction","pos":"concept","definition":"a reaction in which electrons move from one reactant to another","contextSentence":"Cellular respiration is one large redox reaction carried out in steps: glucose is oxidized to CO2 while O2 is reduced to water.","clozeSentence":"Each ___ pairs an oxidation with a reduction: when sodium gives an electron to chlorine, sodium is oxidized and chlorine is reduced.","description":"When methane burns, CH4 loses electrons and O2 gains them, releasing energy. What general type of reaction involves this paired transfer of electrons?","confusables":["oxidation","reduction"],"sourcePages":[51,52,58,67],"correction":null},{"word":"final electron acceptor","pos":"concept","definition":"the molecule that takes electrons at the end of an electron transport chain","contextSentence":"In aerobic respiration, oxygen serves as the final electron acceptor, combining with electrons and H+ at Complex IV to form water.","clozeSentence":"Some anaerobic bacteria use nitrate rather than O2 as their ___, reducing it to nitrite at the end of their electron transport chain.","description":"Cyanide blocks Complex IV, so electrons can no longer be passed to O2; electrons back up, proton pumping stops, and ATP synthesis collapses. What role of O2 has been blocked?","confusables":["oxygen"],"sourcePages":[51,59,61,62,63,73],"correction":"Notes called O2 the final H+ acceptor; correct: O2 is the final electron acceptor, and it then picks up H+ to form water."},{"word":"proton-motive force","pos":"concept","definition":"potential energy stored in an H+ gradient across a membrane, which can drive ATP synthase","contextSentence":"Pumping H+ into the intermembrane space builds a proton-motive force that pushes protons back through ATP synthase into the matrix.","clozeSentence":"The H+ concentration and charge difference across the inner mitochondrial membrane produces ___, the stored push that drives protons through ATP synthase.","description":"As the electron transport chain runs, the intermembrane space becomes more acidic and more positively charged than the matrix. What is the resulting stored push on protons to flow back into the matrix called?","confusables":[],"sourcePages":[61,62,63,69],"correction":null},{"word":"uncoupling","pos":"concept","definition":"H+ leaking back across the inner membrane without passing through ATP synthase, giving heat","contextSentence":"In brown fat, uncoupling by the protein UCP-1 lets protons bypass ATP synthase, so energy from electron transport warms the body instead of making ATP.","clozeSentence":"During ___, electron transport and O2 consumption continue but ATP production falls, because protons return to the matrix through other channels.","description":"A chemical lets H+ cross the inner mitochondrial membrane freely. Treated cells use O2 even faster than normal, yet make little ATP and grow warm. What has the chemical caused?","confusables":[],"sourcePages":[65],"correction":"Notes said uncoupling chemicals carry protons through the intermembrane space; correct: they carry protons across the inner mitochondrial membrane back into the matrix, bypassing ATP synthase."},{"word":"metabolic rate","pos":"concept","definition":"the amount of energy an animal uses per unit of time","contextSentence":"A shrew's metabolic rate per gram is more than ten times an elephant's, so each gram of shrew tissue uses far more O2 per hour.","clozeSentence":"Biologists often estimate an animal's ___ in a respirometer by measuring how much O2 it consumes per gram of body mass per minute.","description":"Crickets in a respirometer use about three times as much O2 per gram at 25 °C as at 10 °C. Which quantity is higher at the warmer temperature?","confusables":[],"sourcePages":[64,66],"correction":null},{"word":"endotherm","pos":"concept","definition":"an animal that uses heat from its own metabolism to keep a nearly constant body temperature","contextSentence":"When the air cools from 25 °C to 10 °C, a mouse, an endotherm, uses more O2 to generate heat and keep its body near 37 °C.","clozeSentence":"The term ___ describes animals such as mice and birds that hold a nearly constant body temperature using heat from their own metabolism.","description":"On a graph of O2 use versus outside temperature, animal A uses the most O2 at the coldest temperatures and less as the air warms. What kind of animal is A?","confusables":[],"sourcePages":[64,66],"correction":null},{"word":"ectotherm","pos":"concept","definition":"an animal whose body temperature rises and falls with its surroundings","contextSentence":"A snake is an ectotherm, so both its body temperature and its O2 consumption rise as the surrounding air warms.","clozeSentence":"The term ___ describes animals such as snakes and crickets, which rely mainly on outside heat sources, so their body temperature tracks their environment.","description":"A lizard is sluggish on a cool morning but becomes active after basking on a sunny rock, and its O2 use rises as it warms. What kind of animal is the lizard?","confusables":[],"sourcePages":[64,66],"correction":null},{"word":"limiting factor","pos":"concept","definition":"the input in shortest supply, which caps how fast a process can go","contextSentence":"In dim light, light intensity is the limiting factor for photosynthesis, so adding more CO2 barely speeds up sugar production.","clozeSentence":"When adding CO2 no longer raises the photosynthesis rate, some other variable, such as light or rubisco activity, has become the ___.","description":"A greenhouse plant's photosynthesis stops speeding up as CO2 is increased, but rises sharply when brighter lamps are switched on. What role was light playing before the lamps were turned on?","confusables":[],"sourcePages":[81,95],"correction":null},{"word":"absorption spectrum","pos":"concept","definition":"a graph of how much light a pigment absorbs at each wavelength","contextSentence":"The absorption spectrum of chlorophyll a shows strong peaks in blue-violet and red light and very little absorption of green light.","clozeSentence":"To measure a pigment's ___, a scientist shines each wavelength through a purified extract and records how much light the pigment takes in.","description":"A student places a purified carotenoid extract in a spectrophotometer, measures how much light it takes up from 400 to 700 nm, and graphs the results. What kind of graph has she made?","confusables":[],"sourcePages":[89,90],"correction":null},{"word":"action spectrum","pos":"concept","definition":"a graph of the rate of photosynthesis at each wavelength of light","contextSentence":"The action spectrum of photosynthesis is broader than chlorophyll a's absorption curve because chlorophyll b and carotenoids capture additional wavelengths.","clozeSentence":"By measuring O2 released by a leaf under each color of light, a botanist plots the ___ for photosynthesis, which peaks in blue and red and dips in green.","description":"In a classic experiment, oxygen-seeking bacteria crowded around the parts of an algal filament lit by red and blue light, but not green. What did this pattern reveal for the alga?","confusables":[],"sourcePages":[89,90],"correction":null}];
function toBank(arr){

    desc:e.description, conf:new Set(e.confusables||[]), src:e.sources||[], multi:!!e.multiSense,
    corr:e.correction||null, pages:e.sourcePages||[]}));
}

// The question text for any of the four types; q = {type, word, sentence, prompt}.
function stemHTML(q){
  if (q.type === "def") return `<span class="big">${esc(q.word)}</span>${DECK.defQ}`;
  if (q.type === "context") return `<blockquote>${highlight(q.sentence, q.word)}</blockquote>${DECK.ctxQ(esc(q.word))}`;
  if (q.type === "cloze") return `<blockquote>${esc(q.sentence).replace("___",'<span class="blank"></span>')}</blockquote>${DECK.clozeQ}`;
  return esc(q.prompt);
}
// What a player sees after answering: the term, its meaning, an example, and any class-notes correction.
function infoHTML(it, type, withExample = true){
  if (!it) return "";
  const example = type === "context" ? it.cloze.replace("___", it.w) : it.ctx;
  return `<p><b>${esc(it.w)}</b> <i>${esc(posTag(it.pos))}</i> \u2014 ${esc(it.def)}</p>`
    + (withExample ? `<p class="ex">\u201C${esc(example)}\u201D</p>` : "")
    + (it.corr ? `<p class="corr"><b>Class notes check:</b> ${esc(it.corr)}</p>` : "");
}
const SOURCE_ABBR = {prepscholar:["PS","PrepScholar: words from official SAT practice tests"],
  mathchops:["MC","MathChops: words from Bluebook practice-test answer choices"],
  testadvantage:["TA","The Test Advantage: words reported from 2023–25 digital SAT administrations"]};

/* ------------------------------------------------------------------
   ADAPTIVE ENGINE
------------------------------------------------------------------- */
const STAGES = [
  {key:"def",      label:"Definition"},
  {key:"context",  label:"In context"},
  {key:"cloze",    label:"Complete the sentence"},
  {key:"describe", label:"Name the word"},
];
const FORMS = 4;                 // question types per word
const MASTERED = FORMS;          // a word with all four types answered right is retired
const COOLDOWN = 3;              // a word can't reappear within this many questions
const REVIEW_SHARE = 0.3;        // share of questions drawn from words you last missed
const FORM_WEIGHTS = [4, 3, 2, 1]; // how often each question type is chosen (earlier types more often)
const DONE_FACTOR = 0.25;        // types already answered right for a word are chosen less often
const STATS = {};                // per-word learning state (saved per player in this browser)
const recent = [];

function stat(w){
  return STATS[w] || (STATS[w] = {seen:0,right:0,wrong:0,runRight:0,hist:[],done:[0,0,0,0]});
}
// Progress saved by the earlier, linear version stored a "stage" (types cleared in order).
function migrateStat(st){
  if (!Array.isArray(st.done)){ const k = Math.min(FORMS, st.stage||0); st.done = [0,1,2,3].map(i => i < k ? 1 : 0); }
  delete st.stage; delete st.reviews;
  return st;
}
const doneCount = w => stat(w).done.reduce((a,b)=>a+b, 0);
const isRetired = w => doneCount(w) >= FORMS;
const lastMissed = w => { const h = stat(w).hist; return h.length > 0 && h[h.length-1] === 0; };

// The multipliers from the design: new 1x, correct 0.7x, correct twice 0.4x, wrong 3x, repeated wrong 5x.
function weightOf(w){
  const s = stat(w);
  if (!s.seen) return 1;
  if (lastMissed(w)) return s.wrong >= 2 ? 5 : 3;
  return s.runRight >= 2 ? 0.4 : 0.7;
}
function weightLabel(w){
  const s = stat(w);
  if (isRetired(w)) return "retired";
  if (!s.seen) return "new";
  if (lastMissed(w)) return s.wrong >= 2 ? "missed again" : "missed";
  return s.runRight >= 2 ? "right 2+ in a row" : "right once";
}

// Word selection. Every word is in play until it is retired. Most questions pick from all
// live words (with the weights above); REVIEW_SHARE of them pick only from words whose last
// answer was wrong. With hundreds of words in play, weights alone would bring a missed word
// back only every few races, so the review slot is what keeps misses coming back soon.
function eligible(){
  let pool = WORDS.filter(x => !isRetired(x.w) && !recent.includes(x.w));
  if (!pool.length) pool = WORDS.filter(x => !isRetired(x.w));
  if (!pool.length) pool = WORDS.slice();          // everything retired: keep playing
  return pool;
}
function drawPools(){
  const live = eligible();
  return {live, missed: live.filter(x => lastMissed(x.w))};
}
function drawChances(){
  const {live, missed} = drawPools();
  const out = {}; WORDS.forEach(x => out[x.w] = 0);
  const share = missed.length ? REVIEW_SHARE : 0;
  const sum = arr => arr.reduce((a,x) => a + weightOf(x.w), 0);
  const tl = sum(live), tm = sum(missed);
  live.forEach(x => out[x.w] += (1 - share) * weightOf(x.w) / tl);
  missed.forEach(x => out[x.w] += share * weightOf(x.w) / tm);
  return out;
}
function weightedPick(arr){
  let r = Math.random() * arr.reduce((a,x) => a + weightOf(x.w), 0);
  for (const x of arr){ r -= weightOf(x.w); if (r <= 0) return x; }
  return arr[arr.length-1];
}
function pickWord(){
  const {live, missed} = drawPools();
  return weightedPick(missed.length && Math.random() < REVIEW_SHARE ? missed : live);
}
// Question type: random, favoring earlier types and types not yet answered right for this word.
function chooseForm(item){
  const d = stat(item.w).done;
  const ws = FORM_WEIGHTS.map((b,f) => b * (d[f] ? DONE_FACTOR : 1));
  let r = Math.random() * ws.reduce((a,b)=>a+b, 0);
  for (let f = 0; f < FORMS; f++){ r -= ws[f]; if (r <= 0) return f; }
  return 0;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function confusable(a,b){ return a.conf.has(b.w) || b.conf.has(a.w); }
function stemOf(w){ return w.length>4 && /[ey]$/.test(w) ? w.slice(0,-1) : w; }
// Highlights the word (or its inflected form) in a sentence; picks the token closest in length to the headword.
function highlight(sentence, w){
  const html = esc(sentence);
  if (/[\s+\-\/]/.test(w) || /[A-Z0-9]/.test(w)){
    // Multi-word or symbol terms (ATP synthase, NAD+, photosystem I): match the whole phrase, allowing a plural.
    const ew = esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp("(^|[^A-Za-z0-9])(" + ew + "(?:e?s)?)(?![A-Za-z0-9])", "i");
    if (re.test(html)) return html.replace(re, (m, pre, t) => pre + "<mark>" + t + "</mark>");
  }
  const st = stemOf(w).toLowerCase();
  let best = null;
  html.replace(/[A-Za-z\u00C0-\u00FF'-]+/g, (tok, off) => {
    if (tok.toLowerCase().startsWith(st)){ const d = Math.abs(tok.length - w.length); if (!best || d < best.d) best = {tok, off, d}; }
    return tok;
  });
  return best ? html.slice(0,best.off) + "<mark>" + best.tok + "</mark>" + html.slice(best.off + best.tok.length) : html;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function makeQuestion(item, form = chooseForm(item)){
  const s = stat(item.w);
  const stage = form;
  const type = STAGES[stage].key;
  let others = shuffle(WORDS.filter(x => x!==item && x.pos===item.pos && !confusable(x,item))).slice(0,3);
  if (others.length < 3) others = others.concat(shuffle(WORDS.filter(x => x!==item && x.pos!==item.pos && !confusable(x,item))).slice(0, 3-others.length));
  const asWords = (type==="cloze"||type==="describe");
  const opts = shuffle([item, ...others]);
  const options = opts.map(x => asWords ? x.w : x.def);
  const answer = opts.indexOf(item);
  const stem = stemHTML({type, word:item.w, sentence: type==="context" ? item.ctx : type==="cloze" ? item.cloze : null, prompt:item.desc});
  return {item, stage, type, label:typeLabel(type), stem, options, answer, wasMissed: s.wrong>0};
}
// A correct answer checks off that question type and every easier one (if you can produce the
// word from its description, you know its definition). A miss un-checks that type and any harder one.
function recordAnswer(item, ok, form){
  const s = stat(item.w);
  const f = Number.isInteger(form) && form >= 0 && form < FORMS ? form : 0;
  s.seen++; s.hist.push(ok?1:0); if (s.hist.length>20) s.hist.shift();
  if (ok){ s.right++; s.runRight++; for (let i = 0; i <= f; i++) s.done[i] = 1; }
  else   { s.wrong++; s.runRight = 0; for (let i = f; i < FORMS; i++) s.done[i] = 0; }
  recent.push(item.w); while (recent.length > COOLDOWN) recent.shift();
}

/* ------------------------------------------------------------------
   SAVED PROGRESS
   Word history is saved in this browser, separately for each player
   name, so two people sharing a computer keep their own progress.
   If storage is blocked (private mode, some embedded previews), the
   game still works and simply forgets on reload.
------------------------------------------------------------------- */
const STORE_KEY = "wordRally.v1";
function storeRead(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
function storeWrite(obj){ try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); return true; } catch (e) { return false; } }
const STORAGE_OK = (()=>{ try { const k="__wr_test"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; } catch (e) { return false; } })();
let store = storeRead();
let currentProfile = null;
// Progress is saved per player name and per subject (SAT progress keeps its original key).
const profileKey = name => (name||"You").trim().toLowerCase() + (DECK_ID === "sat" ? "" : "@" + DECK_ID);
if (store.settings) Object.assign(settings, store.settings);
applyDeck(settings.deck);
function applyDeck(id){
  if (!DECK_DEFS[id]) id = "sat";
  DECK_ID = id; DECK = DECK_DEFS[id]; settings.deck = id;
  WORDS = toBank(DECK_DATA[id]);
  recent.length = 0;
}
// Switch subject: save the current subject's progress, then load this player's progress for the new one.
function switchDeck(id){
  if (!DECK_DEFS[id]) id = "sat";
  if (id === DECK_ID) return;
  if (currentProfile) saveProgress();
  applyDeck(id);
  loadProfile(settings.name);
  saveProgress();
  if (typeof NET !== "undefined") NET.sentPick = null;
  if (typeof updateFoot === "function") updateFoot();
}
function loadProfile(name){
  Object.keys(STATS).forEach(k=>delete STATS[k]); recent.length = 0;
  const p = (store.profiles||{})[profileKey(name)];
  if (p && p.stats) for (const [w,st] of Object.entries(p.stats))
    STATS[w] = Object.assign({seen:0,right:0,wrong:0,runRight:0,hist:[],done:[0,0,0,0]}, migrateStat({...st}));
  currentProfile = profileKey(name);
}
function saveProgress(){
  if (!STORAGE_OK) return;
  store = storeRead();                       // pick up saves from other tabs first
  store.settings = settings;
  store.profiles = store.profiles || {};
  store.profiles[currentProfile] = {name: settings.name, stats: Object.fromEntries(Object.entries(STATS).filter(([,v])=>v.seen)), updated: Date.now()};
  storeWrite(store);
}
function profileSummary(name){
  const p = (store.profiles||{})[profileKey(name)];
  if (!p || !p.stats) return null;
  const st = Object.values(p.stats);
  return {seen: st.filter(x=>x.seen).length, cleared: st.map(x=>migrateStat({...x})).filter(x=>x.done.every(Boolean)).length, missed: st.filter(x=>x.hist && x.hist[x.hist.length-1]===0).length};
}
loadProfile(settings.name);

function newGame(){
  const acc = LEVELS[settings.level];
