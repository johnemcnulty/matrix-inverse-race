   TRACK
------------------------------------------------------------------- */
function buildTrack(){
  const t = document.getElementById("track");
  t.innerHTML = `<div class="trackHead"><span>Start</span><span>Finish · ${G.len}</span></div>` +
    G.players.map(p=>`
      <div class="lane" id="lane${p.id}" data-id="${p.id}">
        <div class="laneName" style="color:${p.color}">${esc(p.name)}<small>${p.isMe?"you":p.acc!=null?Math.round(p.acc*100)+"% bot":(p.connected===false?"away":"")}</small></div>
        <div class="road" style="--cell:calc((100% - 38px) / ${G.len})">
          <div class="token ${p.isMe?"me":""}" style="background:${p.color};--p:0">${esc(p.name[0].toUpperCase())}</div>
          <div class="badges" style="--p:0"></div>
        </div>
      </div>`).join("");
  renderTrack();
}
function renderTrack(){
  G.players.forEach(p=>{
    const lane = document.getElementById("lane"+p.id);
    const f = p.pos/G.len;
    lane.querySelector(".token").style.setProperty("--p",f);
    const b = lane.querySelector(".badges");
    b.style.setProperty("--p",f);
    b.innerHTML = (p.shield?`<b title="Shield">\u{1F6E1}️${p.shield>1?p.shield:""}</b>`:"") +
                  (p.frozen?`<b title="Frozen">❄️${p.frozen>1?p.frozen:""}</b>`:"") +
                  (p.dbl?`<b title="Next advance doubled">×2${p.dbl>1?"·"+p.dbl:""}</b>`:"");
  });
}
function fx(p, text, color){
  const lane = document.getElementById("lane"+p.id); if (!lane) return;
  const road = lane.querySelector(".road");
  const el = document.createElement("div");
  el.className = "float"; el.textContent = text;
  el.style.left = `calc((100% - 38px) * ${p.pos/G.len} + 32px)`;
  el.style.color = color || "var(--ink)";
  road.appendChild(el); setTimeout(()=>el.remove(),1300);
  if (color==="var(--bad)"){ lane.classList.remove("shake"); void lane.offsetWidth; lane.classList.add("shake"); }
}
function addLog(html){
  if (!G) return;
  G.log.unshift(html); if (G.log.length>40) G.log.pop();
  if (G.phase==="bots" && G.turnEvents) G.turnEvents.push(html);
  const ul = document.getElementById("log");
  ul.innerHTML = G.log.map((h,i)=>`<li class="${i===0?"fresh":""}">${h}</li>`).join("");
}
function toast(html, kind="info"){
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast "+kind; el.innerHTML = html;
  box.appendChild(el);
  while (box.children.length>3) box.firstChild.remove();
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),300); }, 3200);
}
const who = p => `<span class="who" style="color:${p.color}">${esc(p.name)}</span>`;

/* ------------------------------------------------------------------
   MOVEMENT & EFFECTS
------------------------------------------------------------------- */
function advance(p){
  if (p.frozen>0){
    p.frozen--; fx(p,"❄ frozen","#2b8fd6");
    addLog(`${who(p)} answered right but was frozen — no move.`);
    if (!p.human && p.frozenByMe){ p.frozenByMe--; toast(`❄ Your freeze worked: <b>${esc(p.name)}</b> answered right but didn't move.`,"good"); }
    return 0;
  }
  let amt = STEP;
  if (p.dbl>0){ p.dbl--; amt *= 2; }
  p.pos = Math.min(G.len, p.pos+amt);
  fx(p, "+"+amt, "var(--good)");
  return amt;
}
function back(t,n){ const was=t.pos; t.pos=Math.max(0,t.pos-n); fx(t,"−"+(was-t.pos),"var(--bad)"); return was-t.pos; }
function steal(src,t,n){
  const got = Math.min(n,t.pos); t.pos -= got; src.pos = Math.min(G.len, src.pos+got);
  fx(t,"−"+got,"var(--bad)"); if (got) fx(src,"+"+got,"var(--good)");
  return got;
}
function freeze(src,t){
  t.frozen = Math.min(2,t.frozen+1);
  if (src.human) t.frozenByMe = (t.frozenByMe||0)+1;
  fx(t,"❄","#2b8fd6");
}
const nm = t => t.human ? "you" : esc(t.name);
// Applies one attack to one target. Returns a short phrase describing what happened.
function strike(src, t, card, fn){
  if (t.shield>0){
    t.shield--; fx(t,"\u{1F6E1} blocked","var(--muted)");
    return {blocked:true, text:`${t.human?"your":esc(t.name)+"'s"} shield blocked it`};
  }
  return {blocked:false, text:fn(t)};
}
function playCard(src, key, target){
  const c = CARDS[key];
  const opps = G.players.filter(p=>p!==src);
  const res = [];   // [{t, blocked, text}]
  const one = fn => { const r = strike(src,target,c,fn); res.push({t:target,...r}); };
  const all = fn => opps.forEach(t => { const r = strike(src,t,c,fn); res.push({t,...r}); });
  switch(key){
    case "repel":   one(t=>{const n=back(t,2); return `${nm(t)} back ${n} (now ${t.pos})`;}); break;
    case "rout":    one(t=>{const n=back(t,4); return `${nm(t)} back ${n} (now ${t.pos})`;}); break;
    case "pilfer":  one(t=>{const n=steal(src,t,1); return n?`stole ${n} from ${nm(t)}`:`${nm(t)} had nothing to steal`;}); break;
    case "plunder": one(t=>{const n=steal(src,t,2); return n?`stole ${n} from ${nm(t)}`:`${nm(t)} had nothing to steal`;}); break;
    case "stymie":  one(t=>{freeze(src,t); return `${t.human ? "your" : esc(t.name)+"'s"} next move is frozen`;}); break;
    case "deluge":  all(t=>{const n=back(t,2); return `${nm(t)} −${n}`;}); break;
    case "petrify": all(t=>{freeze(src,t); return `${nm(t)} frozen`;}); break;
    case "fortify": src.shield=Math.min(2,src.shield+1); fx(src,"\u{1F6E1}","var(--muted)"); res.push({t:src,text:"shield up"}); break;
    case "bulwark": src.shield=Math.min(2,src.shield+2); fx(src,"\u{1F6E1}\u{1F6E1}","var(--muted)"); res.push({t:src,text:"double shield up"}); break;
    case "amplify": src.dbl=Math.min(3,src.dbl+1); fx(src,"×2","var(--accent)"); res.push({t:src,text:"next advance doubled"}); break;
    case "galvanize":src.dbl=Math.min(3,src.dbl+2); fx(src,"×2 ×2","var(--accent)"); res.push({t:src,text:"next two advances doubled"}); break;
  }
  const summary = res.map(r=>r.text).join("; ");
  const onWhom = c.target==="one" ? ` on ${who(target)}` : "";
  addLog(`${who(src)} used <b>${c.icon} ${c.name}</b>${onWhom}: ${summary}.`);
  // Make every attack you make, and every attack on you, impossible to miss.
  if (src.human){
    const anyLanded = res.some(r=>!r.blocked);
    toast(`${c.icon} <b>${c.name}</b>: ${summary}.${res.some(r=>r.blocked)?" (Their shield is used up.)":""}`, anyLanded?"good":"info");
  } else {
    const mine = res.find(r=>r.t && r.t.human);
    if (mine) toast(mine.blocked ? `\u{1F6E1} Your shield blocked ${esc(src.name)}'s <b>${c.name}</b>!`
                                 : `${c.icon} ${esc(src.name)} hit you with <b>${c.name}</b>: ${key==="stymie"||key==="petrify"?"your next correct answer won't move you":key==="pilfer"||key==="plunder"?"they stole from you":"you're knocked back"}.`,
                    mine.blocked?"good":"bad");
  }
  renderTrack();
  checkWin();
}
// Streak rule: 3 in a row earns an attack, 5 in a row earns a power attack, then the streak starts over.
function bumpStreak(p){
  if (p.streak>=5) p.streak = 0;
  p.streak++;
  return p.streak===3 ? 1 : p.streak===5 ? 2 : 0;
}
function offer(tier){ return shuffle([...(tier===2?TIER2:TIER1)]).slice(0,3); }

function checkWin(){
  if (G.over) return true;
  const w = G.players.find(p=>p.pos>=G.len);
  if (w){ G.over = true; G.phase="over"; renderQuestion(); renderSide(); setTimeout(()=>endScreen(w),900); return true; }
  return false;
}

/* ------------------------------------------------------------------
   TURN FLOW
------------------------------------------------------------------- */
function humanTurn(){
  if (G.over) return;
  G.round++;
  G.q = makeQuestion(pickWord());
  G.phase = "question";
  G.picked = null;
  renderQuestion(); renderSide();
}
async function answer(i){
  if (G && G.online) return onlineAnswer(i);
  if (G && G.challenge) return sprintAnswer(i);
  if (!G || G.phase!=="question" || modalOpen()) return;
  const q = G.q, p = me(), ok = i===q.answer;
  G.phase = "feedback"; G.picked = i;
  recordAnswer(q.item, ok, q.stage);
  saveProgress();
  G.asked++;
  let tier = 0, moved = 0;
  if (ok){
    G.correct++;
    tier = bumpStreak(p);
    moved = advance(p);
  } else {
    p.streak = 0;
    G.missed.set(q.item.w, q.item);
    addLog(`${who(p)} missed <b>${q.item.w}</b>.`);
  }
  G.lastMoved = moved;
  renderTrack(); renderQuestion(); renderSide();
  if (checkWin()) return;
  if (tier){
    G.drafting = true;
    await sleep(500);
    const key = await draftModal(tier);
    if (G.hand.length>=HAND_MAX){ const old=G.hand.shift(); addLog(`Hand full — <b>${CARDS[old].name}</b> was discarded.`); }
    G.hand.push(key);
    G.drafting = false;
    renderSide();
    toast(`${CARDS[key].icon} <b>${CARDS[key].name}</b> is in your hand. Tap it to use it.`, "info");
  }
}
async function next(){
  if (G && (G.online || G.challenge)) return;
  if (!G || G.phase!=="feedback" || modalOpen() || G.drafting) return;
  G.phase = "bots"; G.turnEvents = []; renderQuestion(); renderSide();
  for (const b of G.players.slice(1)){
    await sleep(650);
    if (G.over) return;
    botTurn(b);
    renderTrack(); renderQuestion();
    if (checkWin()) return;
  }
  await sleep(900);
  humanTurn();
}
function botTurn(b){
  const word = WORDS[Math.floor(Math.random()*WORDS.length)].w;
  if (Math.random() < b.acc){
    const tier = bumpStreak(b);
    const amt = advance(b);
    if (amt) addLog(`${who(b)} got <b>${word}</b> right: +${amt}.`);
    if (tier && !G.over){
      const key = botChoose(b, offer(tier));
      const c = CARDS[key];
      playCard(b, key, c.target==="one" ? botTarget(b) : null);
    }
  } else {
    b.streak = 0;
    addLog(`${who(b)} missed <b>${word}</b>.`);
  }
}
const DEFENSIVE = ["bulwark","fortify"], OFFENSIVE = ["rout","deluge","plunder","repel","pilfer","stymie","petrify"];
function botChoose(b, keys){
  const leader = Math.max(...G.players.map(p=>p.pos));
  const ahead = b.pos===leader;
  // A leading bot without a shield sometimes shields up; otherwise bots prefer to attack.
  const def = keys.filter(k=>DEFENSIVE.includes(k)), off = keys.filter(k=>OFFENSIVE.includes(k));
  if (ahead && !b.shield && def.length && Math.random()<.35) return def[0];
  if (off.length && Math.random()<.8) return off[Math.floor(Math.random()*off.length)];
  return keys[Math.floor(Math.random()*keys.length)];
}
function botTarget(b){
  const opps = G.players.filter(p=>p!==b);
  const top = Math.max(...opps.map(p=>p.pos));
  const lead = opps.filter(p=>p.pos===top && !p.shield);
  const pool = lead.length ? lead : opps.filter(p=>p.pos===top);
  return pool[Math.floor(Math.random()*pool.length)];
}
async function useCard(idx){
  if (G && G.online) return onlineUseCard(idx);
  if (!G || !["question","feedback"].includes(G.phase) || modalOpen() || G.drafting) return;
  const key = G.hand[idx], c = CARDS[key];
  let target = null;
  if (c.target==="one"){
    target = await targetModal(c);
    if (!target) return;
  }
  G.hand.splice(idx,1);
  playCard(me(), key, target);
  renderSide();
}

------------------------------------------------------------------- */
function renderQuestion(){
  const el = document.getElementById("qcard");
  if (!G) { el.innerHTML = ""; return; }
  if (G.online) return renderOnlineQuestion();
  if (G.challenge) return renderSprint();
  if (G.phase==="bots"){
    const ev = G.turnEvents||[];
    el.innerHTML = `<div class="qmeta"><span class="chip">Rivals' turn</span></div>
      <ul class="turnEvents">${ev.map(h=>`<li>${h}</li>`).join("")}<li class="pending">…</li></ul>`;
    return;
  }
  if (G.phase==="over"){ el.innerHTML = `<div class="waiting">Race over!</div>`; return; }
  const q = G.q, s = stat(q.item.w), done = G.phase==="feedback";
  const ok = done && G.picked===q.answer;
  const keys = ["A","B","C","D"];
  let html = `<div class="qmeta">
      <span class="chip">${q.label}</span>
      ${q.wasMissed?`<span class="chip review">Review word</span>`:""}
      ${me().frozen && !done?`<span class="chip frozen">❄ Frozen: next correct answer won't move you</span>`:""}
      <span class="stageDots" title="Question types answered right for this word">${[0,1,2,3].map(i=>`<i class="${s.done[i]?"on":""}"></i>`).join("")}</span>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts">${q.options.map((o,i)=>{
      let cls = "";
      if (done){ cls = i===q.answer ? "right" : i===G.picked ? "wrong" : "dim"; }
      return `<button class="opt ${cls}" data-i="${i}" ${done?"disabled":""}><span class="k">${keys[i]}</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>`;
  if (done){
    const it = q.item;

    const moveNote = ok ? (G.lastMoved ? `+${G.lastMoved} spaces` : `Frozen — no move this time`) : `No move; streak reset`;
    html += `<div class="feedback ${ok?"ok":"no"}">
      <h3>${ok?"Correct!":"Not quite."} <span style="font-weight:500;color:var(--muted);font-size:14px">· ${moveNote}</span></h3>
      ${infoHTML(it, q.type)}
      <div class="fbRow"><button class="btn primary" id="nextBtn">Next →</button><span class="hint">Enter ↵</span></div>
    </div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  const nb = document.getElementById("nextBtn"); if (nb) nb.onclick = next;
}
function cardHTML(key, tag="div", extra=""){
  const c = CARDS[key];
  return `<${tag} class="card ${c.tier===2?"power":""}" ${extra}>
    <span class="ic">${c.icon}</span>
    <span><span class="nm">${c.name}<em>${c.pos} ${c.gloss}</em></span><div class="ef">${c.effect}</div></span>
  </${tag}>`;
}
function renderSide(){
  if (!G || G.challenge) return;
  const p = me();
  document.getElementById("streak").innerHTML = [1,2,3,4,5].map(i=>
    `<div class="pip ${i<=p.streak?"on":""} ${i===3?"m3":""} ${i===5?"m5":""}"></div>`).join("");
  const canUse = G.online ? !!(NET.state && NET.state.status==="racing") : ["question","feedback"].includes(G.phase);
  const hand = document.getElementById("hand");
  hand.innerHTML = G.hand.length ? G.hand.map((k,i)=>cardHTML(k,"button",`data-i="${i}" ${canUse?"":"disabled"}`)).join("")
    : `<div class="empty">Answer 3 in a row to earn an attack.</div>`;
  hand.querySelectorAll("button.card").forEach(b=>b.onclick=()=>useCard(+b.dataset.i));
  document.getElementById("handPanel").classList.toggle("hasCards", G.hand.length>0);
}

    ${hot.length?`<p class="sub" style="margin-top:12px">Weighted heaviest for your next race: ${hot.map(x=>`<b>${x.w}</b> (${weightOf(x.w)}×)`).join(", ")}</p>`:""}

function wordLab(onClose){
  const ch = drawChances();
  const maxCh = Math.max(...Object.values(ch));
  // Missed words first, then words in progress (most types done first), then retired, then unseen.
  const rank = x => lastMissed(x.w) ? 0 : isRetired(x.w) ? 2 : stat(x.w).seen ? 1 : 3;
  const sorted = WORDS.slice().sort((a,b)=>rank(a)-rank(b) || doneCount(b.w)-doneCount(a.w) || ch[b.w]-ch[a.w] || a.w.localeCompare(b.w));
  const row = x=>{
    const s = stat(x.w), w = weightOf(x.w), hot = w>1;
    const stageName = isRetired(x.w) ? "Retired" : `<span class="stageDots" style="margin:0" title="${STAGES.filter((_,i)=>s.done[i]).map(t=>typeLabel(t.key)).join(", ")||"none yet"}">${[0,1,2,3].map(i=>`<i class="${s.done[i]?"on":""}"></i>`).join("")}</span> ${doneCount(x.w)}/4`;
    const src = DECK_ID === "sat" ? x.src.map(k=>SOURCE_ABBR[k]?`<span class="src" title="${SOURCE_ABBR[k][1]}">${SOURCE_ABBR[k][0]}</span>`:"").join("")
      : (x.pages.length ? `<span class="src" title="Slide pages">p. ${x.pages.slice(0,4).join(", ")}</span>` : "") + (x.corr ? ` <span class="src" title="${esc(x.corr)}" style="color:var(--bad)">notes</span>` : "");
    return `<tr>
      <td class="w" title="${esc(x.def)}">${x.w} <span class="posTag">${POS_ABBR[x.pos]||""}</span></td>
      <td>${stageName}</td>
      <td><span class="hist">${s.hist.slice(-8).map(h=>`<i class="h${h}"></i>`).join("") || `<span style="color:var(--muted)">\u2014</span>`}</span></td>
      <td><span class="mult" style="color:${hot?"var(--bad)":"inherit"}">${w}\u00D7</span> <span style="color:var(--muted);font-size:12px">${weightLabel(x.w)}</span></td>
      <td>${ch[x.w]?`<span class="bar ${hot?"hot":""}"><span style="width:${100*ch[x.w]/maxCh}%"></span></span>${(100*ch[x.w]).toFixed(1)}%`:`<span style="color:var(--muted);font-size:12px">${isRetired(x.w)?"retired":"cooling down"}</span>`}</td>
      <td>${src}</td>
    </tr>`;
  };
  const seen = WORDS.filter(x=>stat(x.w).seen).length;
  const m = openModal(`
    <h2>Word Lab <span style="font-weight:500;color:var(--muted);font-size:16px">\u00B7 ${esc(DECK.title)}</span></h2>
    <p class="sub">How the question engine sees each of the ${WORDS.length} words right now (${seen} seen, ${WORDS.filter(x=>isRetired(x.w)).length} retired). Every word is in play until it is retired. Each question picks a word at random from all live words, weighted new 1\u00D7 \u00B7 right once 0.7\u00D7 \u00B7 right 2+ in a row 0.4\u00D7 \u00B7 missed 3\u00D7 \u00B7 missed again 5\u00D7; ${Math.round(REVIEW_SHARE*100)}% of questions instead pick from words you last missed, so misses come back soon. The question type is also random, favoring earlier types (Definition \u2192 In context \u2192 Complete the sentence \u2192 Name the word) and types not yet answered right. A correct answer checks off that type and the easier ones; a miss un-checks that type and the harder ones. When all four are checked, the word retires. The last ${COOLDOWN} words asked sit out.</p>
    <input class="labSearch" id="labSearch" placeholder="Search ${WORDS.length} words\u2026" autocomplete="off">
    <div style="overflow-x:auto"><table class="lab">
      <thead><tr><th>Word</th><th>Types done</th><th>History</th><th>Weight</th><th>Chance next</th><th>${DECK_ID === "sat" ? "Source" : "Slides"}</th></tr></thead>
      <tbody id="labBody"></tbody>
    </table></div>
    ${DECK_ID === "sat" ? `<p class="sub" style="font-size:12px;margin-top:10px">Sources: ${Object.values(SOURCE_ABBR).map(([a,t])=>`<b>${a}</b> ${t.split(":")[0]}`).join(" \u00B7 ")}. Hover a word to see its definition.</p>` : `<p class="sub" style="font-size:12px;margin-top:10px">Slides: the class-slide pages that cover each term. "notes" marks terms where the class notes said something different; hover to see it.</p>`}
    <div class="rowEnd">
      <button class="btn" id="reset">Reset learning data</button>
      <button class="btn primary" id="close">Close</button>
    </div>`, "wide", "lab");
  const body = m.querySelector("#labBody");
  const draw = q=>{
    q = q.trim().toLowerCase();
    const list = q ? sorted.filter(x=>x.w.includes(q) || (q.length>=4 && x.def.toLowerCase().includes(q))) : sorted;
    body.innerHTML = list.slice(0,200).map(row).join("") +
      (list.length>200?`<tr><td colspan="6" style="color:var(--muted)">\u2026${list.length-200} more \u2014 search to narrow</td></tr>`:"");
  };
  draw("");
  m.querySelector("#labSearch").oninput = e=>draw(e.target.value);
  const done = ()=>{ closeModal(); if (onClose) onClose(); };
  m.querySelector("#close").onclick = done;
  m.querySelector("#reset").onclick = ()=>{
    if (!confirm(`Forget all word history for ${settings.name}? Every word goes back to new.`)) return;
    Object.keys(STATS).forEach(k=>delete STATS[k]); recent.length = 0;
    saveProgress();
    wordLab(onClose);
  };
  m.onclick = e=>{ if (e.target===m) done(); };
}

/* ------------------------------------------------------------------
   ONLINE MULTIPLAYER
   The server (AWS Lambda behind an API Gateway WebSocket, or the local
   dev server) owns the race: it builds each question, checks answers,
   applies attacks and decides when a round ends. This page renders the
   server's state and keeps running the adaptive word engine locally: it
   tells the server which word to ask next and records results in this
   browser's saved progress.
------------------------------------------------------------------- */
// Paste the WebSocketUrl printed by `sam deploy`, e.g. "wss://abc123.execute-api.us-east-1.amazonaws.com/prod".
// A ?server=... parameter in the page URL overrides it (handy for local testing).
const SERVER_URL = "wss://2owywo7buf.execute-api.us-east-1.amazonaws.com/prod";
const PAGE_PARAMS = new URLSearchParams(location.search);
const serverUrl = () => PAGE_PARAMS.get("server") || SERVER_URL;
const SESSION_KEY = "wordRally.session";
const NET = { ws:null, session:null, state:null, version:0, offset:0, seq:-1, recorded:new Set(), sentPick:null,
              tickRound:0, tickAt:0, retry:0, wantOpen:false, pending:null, offerShown:null, endShown:null,
              timer:null, ping:null, lastPos:{}, lastStatus:null, roundSeqStart:null, revealFrom:0, roundForm:{} };
function sessLoad(){ try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch (e) { return null; } }
function sessSave(v){ try { v ? sessionStorage.setItem(SESSION_KEY, JSON.stringify(v)) : sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
const serverNow = () => Date.now() + NET.offset;
const pColor = i => `var(--p${i})`;
const inRoom = () => !!NET.session;
const TYPE_LABEL = {def:"Definition", context:"In context", cloze:"Complete the sentence", describe:"Name the word"};
function setRoomParam(code){
  try { const u = new URL(location.href); code ? u.searchParams.set("room", code) : u.searchParams.delete("room"); history.replaceState(null, "", u); } catch (e) {}
}
function shareLink(code){
  try {
    const u = new URL(location.href); u.search = ""; u.hash = "";
    u.searchParams.set("room", code);
    if (PAGE_PARAMS.get("server")) u.searchParams.set("server", PAGE_PARAMS.get("server"));
    return u.toString();
  } catch (e) { return code; }
}

/* ---- connection ---- */
function netSend(obj){
  if (NET.ws && NET.ws.readyState === 1){ NET.ws.send(JSON.stringify(obj)); return true; }
  return false;
}
function netOpen(firstMsg){
  const url = serverUrl();
  if (!url){ toast("Multiplayer isn't set up yet: add your server's URL to the page (see the README).", "bad"); return; }
  if (NET.ws && NET.ws.readyState <= 1){
    if (firstMsg){ if (NET.ws.readyState === 1) netSend(firstMsg); else NET.pending = firstMsg; }
    return;
  }
  NET.wantOpen = true; NET.pending = firstMsg || null;
  let ws;
  try { ws = new WebSocket(url); } catch (e) { toast("Couldn't reach the game server.", "bad"); return; }
  NET.ws = ws;
  ws.onopen = ()=>{
    NET.retry = 0;
    if (NET.pending){ netSend(NET.pending); NET.pending = null; }
    else if (NET.session) netSend({action:"rejoin", ...NET.session});
    clearInterval(NET.ping);
    NET.ping = setInterval(()=>netSend({action:"ping"}), 4*60*1000);   // API Gateway drops idle sockets after 10 min
  };
  ws.onmessage = e=>{ let m; try { m = JSON.parse(e.data); } catch (_) { return; } onNet(m); };
  ws.onclose = ()=>{
    if (NET.ws !== ws) return;
    NET.ws = null; clearInterval(NET.ping);
    if (NET.wantOpen && NET.session){
      const d = Math.min(8000, 600 * 2 ** NET.retry++);
      if (NET.retry === 1) toast("Connection lost. Reconnecting…", "info");
      setTimeout(()=>{ if (NET.wantOpen && !NET.ws) netOpen(null); }, d);
    } else if (NET.wantOpen){
      NET.wantOpen = false;
      if (modalKind() === "connecting"){ closeModal(); setupScreen(PAGE_PARAMS.get("room") || ""); }
      toast("Couldn't connect to the game server.", "bad");
    }
  };
}
function resetNet(){
  clearInterval(NET.timer); NET.timer = null;
  Object.assign(NET, { state:null, version:0, seq:-1, sentPick:null, tickRound:0, offerShown:null, endShown:null,
                       lastPos:{}, lastStatus:null, roundSeqStart:null, revealFrom:0, roundForm:{} });
  NET.recorded.clear();
}
function netLeave(){
  netSend({action:"leave"});
  NET.wantOpen = false; NET.session = null; sessSave(null); setRoomParam(null);
  const ws = NET.ws; NET.ws = null; clearInterval(NET.ping);
  if (ws) setTimeout(()=>{ try { ws.close(); } catch (e) {} }, 300);
  resetNet();
  G = null; closeModal(); clearBoard();
}
function clearBoard(){
  document.getElementById("track").innerHTML = "";
  document.getElementById("qcard").innerHTML = "";
  document.getElementById("hand").innerHTML = "";
  document.getElementById("log").innerHTML = "";
  document.getElementById("streak").innerHTML = "";
}

function onNet(m){
  if (m.type === "joined"){
    if (!NET.session || NET.session.code !== m.code) resetNet();
    NET.session = {code:m.code, playerId:m.playerId, token:m.token};
    sessSave(NET.session); setRoomParam(m.code);
    return;
  }
  if (m.type === "error"){
    const fatal = ["rejoin_failed", "not_in_room"].includes(m.code) || (m.code === "no_room" && NET.session);
    if (fatal){
      NET.wantOpen = false; NET.session = null; sessSave(null); setRoomParam(null);
      try { NET.ws && NET.ws.close(); } catch (e) {}
      NET.ws = null; resetNet(); G = null; clearBoard();
      setupScreen("");
      toast("That room is no longer available. Create or join another one.", "bad");
      return;
    }
    if (!NET.session && modalKind() === "connecting"){
      closeModal(); setupScreen(PAGE_PARAMS.get("room") || "");
      NET.wantOpen = false; try { NET.ws && NET.ws.close(); } catch (e) {}
    }
    toast(esc(m.message), "bad");
    return;
  }
  if (m.type === "state"){
    if (m.version < NET.version) return;          // an older broadcast arriving late
    NET.version = m.version;
    NET.offset = m.now - Date.now();
    NET.state = m;
    applyOnline(m);
  }
}

/* ---- applying server state ---- */
const takeoverOK = () => !modalOpen() || ["lobby","end","connecting","draft","target"].includes(modalKind());
function applyOnline(s){
  const meId = s.you && s.you.id;
  if (!meId) return;
  // Everyone in a room plays the room's subject (the host picks it in the lobby).
  if (s.settings && s.settings.deck && s.settings.deck !== DECK_ID) switchDeck(s.settings.deck);
  const first = NET.seq < 0;
  for (const ev of s.events){
    if (ev.seq <= NET.seq) continue;
    NET.seq = ev.seq;
    if (!first) onlineEvent(s, ev, meId);
  }
  if (s.status === "lobby"){
    if (G && G.online){ G = null; clearBoard(); }
    NET.endShown = null; NET.lastStatus = "lobby";
    if (!NET.sentPick){ NET.sentPick = computePick(null); netSend({action:"pick", ...NET.sentPick}); }
    if (takeoverOK()) lobbyModal(s);
    return;
  }
  syncOnlineG(s, meId);
  NET.lastStatus = s.status;
  if (s.status === "racing"){
    if (["lobby","end","connecting"].includes(modalKind())) closeModal();
    handleOnlineQuestion(s);
    G.phase = onlinePhase(s);
    maybeOffer(s);
  } else {
    G.phase = "over";
  }
  renderTrack(); renderSide(); renderQuestion();
  if (s.status === "over"){
    const key = s.winnerId + ":" + s.version;
    if (!NET.endShown && takeoverOK()){ NET.endShown = key; onlineEndScreen(s); }
  }
  if (!NET.timer) NET.timer = setInterval(onlineTick, 200);
}

function syncOnlineG(s, meId){
  const ids = s.players.map(p=>p.id).join(",");
  const newRace = s.status === "racing" && NET.lastStatus !== "racing" && NET.lastStatus !== null;
  if (!G || !G.online || G.ids !== ids || G.len !== s.settings.len || newRace || !G.started){
    const keepLog = G && G.online && !newRace ? G.log : [];
    G = { online:true, started:true, ids, len:s.settings.len,
          players: s.players.map(p=>({id:p.id, name:p.name, color:pColor(p.color), isMe:p.id===meId, human:true,
                                       connected:p.connected, pos:p.pos, streak:p.streak, shield:p.shield, frozen:p.frozen, dbl:p.dbl})),
          hand:[], log:keepLog, phase:"waiting", q:null, qRound:0, picked:null, over:false, asked:0, correct:0, missed:new Map() };
    NET.lastPos = {};
    buildTrack();
    document.getElementById("log").innerHTML = G.log.map(h=>`<li>${h}</li>`).join("");
  }
  for (const sp of s.players){
    const gp = G.players.find(p=>p.id===sp.id);
    Object.assign(gp, {pos:sp.pos, streak:sp.streak, shield:sp.shield, frozen:sp.frozen, dbl:sp.dbl, connected:sp.connected});
    const prev = NET.lastPos[sp.id];
    if (prev != null && prev !== sp.pos) fx(gp, (sp.pos > prev ? "+" : "−") + Math.abs(sp.pos - prev), sp.pos > prev ? "var(--good)" : "var(--bad)");
    NET.lastPos[sp.id] = sp.pos;
    const small = document.querySelector(`#lane${sp.id} .laneName small`);
    if (small) small.textContent = sp.id===meId ? "you" : sp.connected ? (sp.answered && s.status==="racing" ? "answered" : "") : "away";
  }
  G.hand = s.you.hand.slice();
  G.over = s.status === "over";
}

// The client chooses which word the server should ask next, using this browser's
// adaptive weights. `exclude` is the word currently on screen.
function computePick(exclude){
  const saved = recent.slice();
  if (exclude && !recent.includes(exclude)) recent.push(exclude);
  const item = pickWord();
  recent.length = 0; recent.push(...saved);
  return {word:item.w, stage:chooseForm(item)};   // "stage" = question type index the server should ask
}
function maxSeq(s){ return s.events.reduce((m,e)=>Math.max(m,e.seq), 0); }
function handleOnlineQuestion(s){
  const q = s.you.question;
  if (q && q.round !== G.qRound){
    G.qRound = q.round; G.picked = null;
    NET.revealFrom = NET.roundSeqStart ?? Math.max(0, maxSeq(s) - 6);
    NET.roundSeqStart = maxSeq(s);
    NET.askedPick = NET.sentPick;   // the word we asked for this round (when the question hides it)
    NET.roundForm[q.round] = Math.max(0, STAGES.findIndex(t => t.key === q.type));
    const current = q.word || (NET.sentPick && NET.sentPick.word) || null;
    NET.sentPick = computePick(current);
    netSend({action:"pick", ...NET.sentPick});   // the server needs it before this round ends
  }
  if (q && q.result && !NET.recorded.has(q.round)) recordOnline(q.result.word, q.result.correct, q.round);
  const last = s.you.last;
  if (last && last.timedOut && !NET.recorded.has(last.round)) recordOnline(last.word, false, last.round);
}
function recordOnline(word, ok, round){
  NET.recorded.add(round);
  const item = WORDS.find(x=>x.w===word);
  if (!item) return;
  recordAnswer(item, ok, NET.roundForm[round] ?? 0); saveProgress();
  G.asked++; if (ok) G.correct++; else G.missed.set(item.w, item);
}
function onlinePhase(s){
  const r = s.round, q = s.you.question;
  if (!r || !q) return "waiting";
  if (serverNow() < r.startsAt) return "reveal";
  if (q.answered) return "feedback";
  return G.picked != null ? "sent" : "question";
}
function onlineTick(){
  const s = NET.state;
  if (!s || s.status !== "racing" || !G || !G.online) return;
  const r = s.round, now = serverNow();
  const phase = onlinePhase(s);
  if (phase !== G.phase){ G.phase = phase; renderQuestion(); renderSide(); }
  const fill = document.getElementById("timerFill");
  if (fill){
    const f = Math.max(0, Math.min(1, (r.deadline - now) / (r.deadline - r.startsAt)));
    fill.style.width = (100*f) + "%"; fill.classList.toggle("low", f < 0.25);
  }
  const cd = document.getElementById("countdown"); if (cd) cd.textContent = Math.max(1, Math.ceil((r.startsAt - now)/1000));
  const sl = document.getElementById("secsLeft"); if (sl) sl.textContent = Math.max(0, Math.ceil((r.deadline - now)/1000)) + "s";
  // Lambda has no timers, so clients nudge the server when the deadline passes; it checks its own clock.
  if (now >= r.deadline && (NET.tickRound !== r.n || Date.now() - NET.tickAt > 2500)){
    NET.tickRound = r.n; NET.tickAt = Date.now();
    netSend({action:"tick", round:r.n});
  }
}
function maybeOffer(s){
  const off = s.you.offer;
  if (!off) return;
  const key = (s.round ? s.round.n : 0) + ":" + off.tier + ":" + off.keys.join(",");
  if (NET.offerShown === key || modalOpen()) return;
  NET.offerShown = key;
  draftModal(off.tier, off.keys).then(k=>{ netSend({action:"choose", card:k}); });
}
function onlineEvent(s, ev, meId){
  const html = esc(ev.text).replace(/\{(p\d+)\}/g, (_, id)=>{
    const p = s.players.find(x=>x.id===id);
    return p ? `<span class="who" style="color:${pColor(p.color)}">${esc(p.id===meId ? "You" : p.name)}</span>` : "Someone";
  });
  if (G && G.online) addLog(html);
  const targeted = (ev.targets||[]).includes(meId);
  if (ev.kind === "card" && ev.actor === meId) toast(html, "good");
  else if (ev.kind === "card" && targeted) toast(html, "bad");
  else if (ev.kind === "blocked" && targeted) toast(html, "good");
  else if (ev.kind === "blocked" && ev.actor === meId) toast(html + " (Their shield is used up.)", "info");
  else if (ev.kind === "win") toast(html, ev.actor === meId ? "good" : "info");
  else if (ev.kind === "info" && s.status === "racing" && /disconnected|is back|left/.test(ev.text)) toast(html, "info");
}

/* ---- player actions ---- */
function onlineAnswer(i){
  const s = NET.state, q = s && s.you && s.you.question;
  if (!q || q.answered || G.phase !== "question" || modalOpen()) return;
  G.picked = i; G.phase = "sent";
  netSend({action:"answer", round:q.round, choice:i, nextPick:NET.sentPick});
  renderQuestion();
}
async function onlineUseCard(idx){
  const s = NET.state;
  if (!s || s.status !== "racing" || modalOpen()) return;
  const key = G.hand[idx], c = CARDS[key];
  let target = null;
  if (c.target === "one"){ target = await targetModal(c); if (!target) return; }
  netSend({action:"play", card:key, target: target ? target.id : undefined});
}

/* ---- rendering ---- */
function renderOnlineQuestion(){
  const el = document.getElementById("qcard");
  const s = NET.state;
  if (!s || !G){ el.innerHTML = ""; return; }
  if (s.status === "over"){ el.innerHTML = `<div class="waiting">Race over!</div>`; return; }
  const q = s.you.question, r = s.round;
  if (!q || !r){ el.innerHTML = `<div class="waiting">Waiting for the next question…</div>`; return; }
  const now = serverNow();
  if (now < r.startsAt){
    const evs = s.events.filter(e=>e.seq > NET.revealFrom).map(e=>esc(e.text).replace(/\{(p\d+)\}/g,(_,id)=>{
      const p = s.players.find(x=>x.id===id); return p ? `<span class="who" style="color:${pColor(p.color)}">${esc(p.id===s.you.id?"You":p.name)}</span>` : "Someone"; }));
    el.innerHTML = `<div class="qmeta"><span class="chip">Round ${r.n}</span></div>
      <div class="reveal"><div class="cd" id="countdown">${Math.max(1, Math.ceil((r.startsAt-now)/1000))}</div><div>${r.n===1?"Get ready!":"Next question coming up"}</div></div>
      ${r.n > 1 && evs.length ? `<h4 class="revealHead">Last round</h4><ul class="turnEvents">${evs.map(h=>`<li>${h}</li>`).join("")}</ul>` : ""}`;
    return;
  }
  const keys = ["A","B","C","D"];
  const known = q.word ? WORDS.find(x=>x.w===q.word) : null;
  const wasMissed = known && stat(known.w).wrong > 0 && !q.result;
  const stem = stemHTML(q);
  const res = q.result, locked = !!res || G.picked != null;
  let html = `<div class="qmeta">
      <span class="chip">Round ${r.n} · ${typeLabel(q.type)}</span>
      ${wasMissed ? `<span class="chip review">Review word</span>` : ""}
      ${me().frozen && !res ? `<span class="chip frozen">❄ Frozen: a correct answer won't move you</span>` : ""}
      <span class="secsLeft" id="secsLeft"></span>
    </div>
    <div class="timer"><span id="timerFill"></span></div>
    <div class="stem">${stem}</div>
    <div class="opts">${q.options.map((o,i)=>{
      let cls = "";
      if (res) cls = i===res.answer ? "right" : i===res.choice ? "wrong" : "dim";
      else if (G.picked === i) cls = "pending";
      return `<button class="opt ${cls}" data-i="${i}" ${locked?"disabled":""}><span class="k">${keys[i]}</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>`;
  if (res){
    const it = WORDS.find(x=>x.w===res.word);
    const waiting = r.answered < r.of ? `Waiting for others: ${r.answered} of ${r.of} answered.` : "Everyone has answered.";
    html += `<div class="feedback ${res.correct?"ok":"no"}">
      <h3>${res.correct ? "Correct!" : "Not quite."} <span style="font-weight:500;color:var(--muted);font-size:14px">· ${res.correct ? "you move when the round ends" : "no move; streak reset"}</span></h3>
      ${infoHTML(it, q.type)}
      <div class="fbRow"><span class="hint">${waiting}</span></div>
    </div>`;
  } else if (G.picked != null){
    html += `<div class="fbRow"><span class="hint">Checking your answer…</span></div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  onlineTick();
}

/* ------------------------------------------------------------------
   CHALLENGE MODE
   A timed sprint you send to a friend. The server fixes the question
   list, so both players get the same questions in the same order, and
   it keeps the clock and the official score. Harder question types are
   worth more. Each answer also counts toward your own word progress.
------------------------------------------------------------------- */
const CH_KEY = "wordRally.challenges";
const CH_POINTS = {def:10, context:12, cloze:14, describe:16};
const WRONG_PAUSE_MS = 2200, RIGHT_PAUSE_MS = 450;
const CH = { ws:null, pending:new Map(), seq:0, play:null, timer:null, mem:[] };
function chList(){ try { return JSON.parse(localStorage.getItem(CH_KEY)) || []; } catch (e) { return CH.mem; } }
function chSave(list){ CH.mem = list.slice(0, 30); try { localStorage.setItem(CH_KEY, JSON.stringify(CH.mem)); } catch (e) {} }
function chRemember(id, token, role){ chSave([{id, token, role, at:Date.now()}, ...chList().filter(x=>x.id!==id)]); }
const chToken = id => (chList().find(x=>x.id===id) || {}).token || null;
function setChallengeParam(id){
  try { const u = new URL(location.href); id ? u.searchParams.set("challenge", id) : u.searchParams.delete("challenge"); u.searchParams.delete("room"); history.replaceState(null, "", u); } catch (e) {}
}
function challengeLink(id){
  try {
    const u = new URL(location.href); u.search = ""; u.hash = "";
    u.searchParams.set("challenge", id);
    if (PAGE_PARAMS.get("server")) u.searchParams.set("server", PAGE_PARAMS.get("server"));
    return u.toString();
  } catch (e) { return id; }
}

// Request/reply over a WebSocket (the same server as multiplayer).
function chRequest(msg){
  return new Promise((resolve, reject)=>{
    const url = serverUrl();
    if (!url) return reject(new Error("Challenges need the Word Rally server (see the README)."));
    const reqId = "c" + (++CH.seq);
    CH.pending.set(reqId, {resolve, reject});
    setTimeout(()=>{ if (CH.pending.has(reqId)){ CH.pending.delete(reqId); reject(new Error("The server didn't answer. Check your connection and try again.")); } }, 12000);
    const send = ()=>{ try { CH.ws.send(JSON.stringify({...msg, reqId})); } catch (e) {} };
    if (CH.ws && CH.ws.readyState === 1) return send();
    if (CH.ws && CH.ws.readyState === 0){ CH.ws.addEventListener("open", send, {once:true}); return; }
    let ws;
    try { ws = new WebSocket(url); } catch (e) { CH.pending.delete(reqId); return reject(new Error("Couldn't reach the game server.")); }
    CH.ws = ws;
    ws.addEventListener("open", send, {once:true});
    ws.onmessage = e=>{
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      const p = CH.pending.get(m.reqId); if (!p) return;
      CH.pending.delete(m.reqId);
      if (m.type === "error") p.reject(Object.assign(new Error(m.message), {code:m.code})); else p.resolve(m);
    };
    ws.onclose = ()=>{
      if (CH.ws === ws) CH.ws = null;
      for (const p of CH.pending.values()) p.reject(new Error("Lost the connection to the server. Please try again."));
      CH.pending.clear();
    };
  });
}
function chBusy(text){ openModal(`<h2>${esc(text)}</h2><p class="sub">Talking to the game server.</p>`, "", "connecting"); }
function chFail(err, retry){
  const m = openModal(`<h2>Something went wrong</h2><p class="sub">${esc(err.message || String(err))}</p>
    <div class="rowEnd"><button class="btn" id="menu">Menu</button>${retry?`<button class="btn primary" id="retry">Try again</button>`:""}</div>`, "", "challenge");
  m.querySelector("#menu").onclick = ()=>{ setChallengeParam(null); setupScreen(""); };
  if (retry) m.querySelector("#retry").onclick = retry;
}
function leaveOtherModes(){
  if (inRoom()) netLeave();
  if (G && !G.challenge){ G = null; clearBoard(); }
}

/* ---- create / open ---- */
async function createChallenge(minutes){
  leaveOtherModes();
  chBusy("Creating your challenge…");
  try {
    const r = await chRequest({action:"challengeCreate", name:settings.name, minutes, deck:DECK_ID});
    chRemember(r.challenge.id, r.token, "creator");
    setChallengeParam(r.challenge.id);
    challengeScreen(r.challenge);
  } catch (e) { chFail(e, ()=>createChallenge(minutes)); }
}
async function openChallenge(id){
  leaveOtherModes();
  chBusy("Loading the challenge…");
  try {
    const r = await chRequest({action:"challengeGet", id, token:chToken(id)});
    setChallengeParam(id);
    switchDeck(r.challenge.deck || "sat");
    challengeScreen(r.challenge);
  } catch (e) {
    if (e.code === "no_challenge"){ setChallengeParam(null); setupScreen(""); toast(esc(e.message), "bad"); }
    else chFail(e, ()=>openChallenge(id));
  }
}
const mins = n => `${n} minute${n===1?"":"s"}`;
function challengeScreen(ch){
  const me = ch.you ? ch[ch.you] : null;
  if (me && me.status === "done") return challengeResults(ch);
  if (!me && ch.challenger) return challengeResults(ch);          // two players already: show the result
  let html, needName = false;
  if (me && me.status === "playing"){
    html = `<h2>Challenge in progress</h2><p class="sub">Your clock is still running. Pick up where you left off.</p>`;
  } else if (ch.you === "creator"){
    html = `<h2>Your ${mins(ch.minutes)} challenge is ready</h2>
      <p class="sub">You play first. When you're done you'll get a link to send to a friend, who gets exactly the same questions.</p>`;
  } else {
    needName = true;
    const c = ch.creator;
    html = `<h2>${esc(c.name)} challenged you!</h2>
      <p class="sub">A ${mins(ch.minutes)} ${esc((DECK_DEFS[ch.deck]||DECK_DEFS.sat).title)} sprint, with the same questions ${esc(c.name)} got.</p>
      <div class="stat"><div><b>${c.status==="done" ? c.score : "—"}</b><span>${c.status==="done" ? "score to beat" : `${esc(c.name)} hasn't played yet`}</span></div>
      <div><b>${ch.minutes}:00</b><span>on the clock</span></div></div>
      <div class="field"><label for="chName">Your name</label><input id="chName" maxlength="14" value="${esc(settings.name==="You"?"":settings.name)}" placeholder="Your name"></div>`;
  }
  html += `<div class="rules"><b>How scoring works</b><ul>
      <li>Answer as many as you can before the clock runs out.</li>
      <li>Points: Definition 10 · In context 12 · Complete the sentence 14 · Name the word 16.</li>
      <li>A wrong answer shows you the right one for a moment, and that time counts.</li></ul></div>
    <div class="rowEnd"><button class="btn" id="menu">Menu</button><button class="btn primary" id="startCh">${me && me.status==="playing" ? "Resume" : "Start"}</button></div>`;
  const m = openModal(html, "", "challenge");
  m.querySelector("#menu").onclick = ()=>{ setChallengeParam(null); setupScreen(""); };
  const go = ()=>{
    if (needName){
      const n = m.querySelector("#chName").value.trim();
      if (!n){ toast("Enter your name first.", "bad"); m.querySelector("#chName").focus(); return; }
      settings.name = n;
      if (profileKey(n) !== currentProfile) loadProfile(n);
      saveProgress(); updateFoot();
    }
    startChallenge(ch.id);
  };
  m.querySelector("#startCh").onclick = go;
  const ni = m.querySelector("#chName");
  if (ni){ ni.onkeydown = e=>{ if (e.key==="Enter") go(); }; setTimeout(()=>ni.focus(), 50); }
}
async function startChallenge(id){
  chBusy("Starting…");
  try {
    const r = await chRequest({action:"challengeStart", id, token:chToken(id), name:settings.name});
    chRemember(id, r.token, r.challenge.you);
    switchDeck(r.challenge.deck || "sat");
    runSprint(r.challenge, r.play, r.token);
  } catch (e) {
    if (e.code === "done" || e.code === "full") openChallenge(id);
    else chFail(e, ()=>startChallenge(id));
  }
}

/* ---- the timed sprint ---- */
function runSprint(ch, play, token){
  closeModal();
  const offset = ch.now - Date.now();
  const P = { id:ch.id, token, minutes:ch.minutes, questions:play.questions, choices:play.choices.slice(),
              endLocal: play.endsAt - offset, total: ch.minutes*60000, phase:"question", finished:false,
              score:0, correct:0, lastSent:play.choices.length, picked:null };
  P.choices.forEach((c,i)=>{ const q = P.questions[i]; if (q && c === q.answer){ P.correct++; P.score += CH_POINTS[q.type]||10; } });
  CH.play = P;
  G = { challenge:true, phase:"question" };
  document.body.classList.add("sprint");
  clearInterval(CH.timer);
  CH.timer = setInterval(sprintTick, 200);
  if (P.choices.length >= P.questions.length || Date.now() >= P.endLocal) return finishSprint();
  renderQuestion();
}
function sprintTick(){
  const P = CH.play; if (!P || P.finished) return;
  const left = Math.max(0, P.endLocal - Date.now());
  const t = document.getElementById("spTime");
  if (t){ const s = Math.ceil(left/1000); t.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
  const fill = document.getElementById("timerFill");
  if (fill){ fill.style.width = (100*left/P.total) + "%"; fill.classList.toggle("low", left < 10000); }
  if (left <= 0) finishSprint();
}
function sprintAnswer(i){
  const P = CH.play;
  if (!P || P.finished || P.phase !== "question" || modalOpen()) return;
  const idx = P.choices.length, q = P.questions[idx];
  const ok = i === q.answer, pts = CH_POINTS[q.type] || 10;
  P.choices.push(i); P.picked = i; P.phase = "feedback"; G.phase = "feedback";
  if (ok){ P.correct++; P.score += pts; }
  const item = WORDS.find(x=>x.w===q.word);
  if (item){ recordAnswer(item, ok, Math.max(0, STAGES.findIndex(t=>t.key===q.type))); saveProgress(); }
  renderQuestion();
  if (P.choices.length - P.lastSent >= 3){           // save progress so a closed tab doesn't lose it
    P.lastSent = P.choices.length;
    chRequest({action:"challengeProgress", id:P.id, token:P.token, choices:P.choices}).catch(()=>{});
  }
  setTimeout(()=>{
    if (P.finished || CH.play !== P) return;
    if (P.choices.length >= P.questions.length) return finishSprint();
    P.phase = "question"; G.phase = "question"; P.picked = null;
    renderQuestion();
  }, ok ? RIGHT_PAUSE_MS : WRONG_PAUSE_MS);
}
async function finishSprint(){
  const P = CH.play; if (!P || P.finished) return;
  P.finished = true; P.phase = "done"; G.phase = "done";
  clearInterval(CH.timer);
  renderQuestion();
  const submit = async ()=>{
    chBusy("Sending your score…");
    try {
      const r = await chRequest({action:"challengeFinish", id:P.id, token:P.token, choices:P.choices});
      challengeResults(r.challenge);
    } catch (e) { chFail(e, submit); }
  };
  await submit();
}
function renderSprint(){
  const el = document.getElementById("qcard");
  const P = CH.play;
  if (!P){ el.innerHTML = ""; return; }
  const answered = P.choices.length;
  const head = `<div class="sprintBar">
      <div><b id="spScore">${P.score}</b><span>points</span></div>
      <div><b>${P.correct}/${answered}</b><span>correct</span></div>
      <div><b id="spTime">–:––</b><span>left</span></div>
    </div>
    <div class="timer"><span id="timerFill"></span></div>`;
  if (P.phase === "done"){
    el.innerHTML = head + `<div class="reveal"><div class="cd">${P.score}</div><div>Time! ${P.correct} of ${answered} correct.</div></div>`;
    sprintTick(); return;
  }
  const idx = P.phase === "feedback" ? answered - 1 : answered;
  const q = P.questions[idx];
  const keys = ["A","B","C","D"];
  const stem = stemHTML(q);
  const fb = P.phase === "feedback";
  const ok = fb && P.picked === q.answer;
  const item = WORDS.find(x=>x.w===q.word);
  let html = head + `<div class="qmeta"><span class="chip">${typeLabel(q.type)} · ${CH_POINTS[q.type]} pts</span>
      ${fb ? `<span class="chip ${ok?"":"review"}" style="${ok?"color:var(--good)":""}">${ok ? "+"+CH_POINTS[q.type] : "Not quite"}</span>` : ""}
      <span class="secsLeft">Question ${idx+1}</span></div>
    <div class="stem">${stem}</div>
    <div class="opts">${q.options.map((o,i)=>{
      const cls = fb ? (i===q.answer ? "right" : i===P.picked ? "wrong" : "dim") : "";
      return `<button class="opt ${cls}" data-i="${i}" ${fb?"disabled":""}><span class="k">${keys[i]}</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>`;
  if (fb && !ok && item) html += `<div class="feedback no">${infoHTML(item, q.type, false)}</div>`;
  el.innerHTML = html;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>sprintAnswer(+b.dataset.i));
  sprintTick();
}
function endSprintView(){
  clearInterval(CH.timer); CH.play = null;
  document.body.classList.remove("sprint");
  if (G && G.challenge){ G = null; clearBoard(); }
}

/* ---- results ---- */
function challengeResults(ch){
  const role = ch.you, me = role ? ch[role] : null;
  const oppRole = role === "creator" ? "challenger" : "creator";
  const opp = role ? ch[oppRole] : null;
  const row = (s, label) => s ? `<div><b>${s.status==="done" ? s.score : "—"}</b><span>${esc(s.name)}${label}${s.status==="done" ? ` · ${s.correct}/${s.answered} correct` : s.status==="playing" ? " · playing now" : " · not played yet"}</span></div>` : "";
  let title;
  if (ch.result){
    const w = ch.result.winner;
    title = w === "tie" ? "It's a tie!" : (w === role ? "\u{1F3C6} You win!" : `\u{1F3C6} ${esc(ch[w].name)} wins!`);
  } else if (me) {
    title = `You scored ${me.score}`;
  } else title = "Challenge";
  const waiting = !ch.result && me && (opp ? `${esc(opp.name)} hasn't finished yet. Check back later; this page shows the result once they're done.` : "");
  const link = challengeLink(ch.id);
  const showShare = role === "creator" && !ch.challenger;
  const m = openModal(`
    <h2>${title}</h2>
    <p class="sub">${mins(ch.minutes)} · ${esc((DECK_DEFS[ch.deck]||DECK_DEFS.sat).title)} · same questions for both players</p>
    <div class="stat">${role ? row(me, " (you)") + (opp ? row(opp, "") : `<div><b>—</b><span>waiting for a friend</span></div>`) : row(ch.creator,"") + row(ch.challenger,"")}</div>
    ${showShare ? `<p><b>Send this link to a friend.</b> They'll see your score and get the same questions.</p>
      <div class="joinRow"><input id="chLink" readonly value="${esc(link)}"><button class="btn" id="copyCh">Copy</button>${navigator.share ? `<button class="btn" id="shareCh">Share</button>` : ""}</div>
      <p class="sub" style="font-size:13px;margin-top:8px">Open the same link later (or find it under Challenge in the menu) to see who won.</p>` : ""}
    ${waiting ? `<p class="sub">${waiting}</p>` : ""}
    <div class="rowEnd">
      ${!ch.result && role ? `<button class="btn" id="refresh">Check again</button>` : ""}
      <button class="btn" id="menu">Menu</button>
      <button class="btn primary" id="again">New challenge</button>
    </div>`, "", "challenge");
  const copy = m.querySelector("#copyCh");
  if (copy) copy.onclick = ()=>{
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
      .then(()=>toast("Link copied.", "good")).catch(()=>{ m.querySelector("#chLink").select(); toast("Select the link and copy it.", "info"); });
  };
  const sh = m.querySelector("#shareCh");
  if (sh) sh.onclick = ()=>navigator.share({title:"Word Rally challenge", text:`I scored ${me ? me.score : ""} in a ${mins(ch.minutes)} Word Rally vocab sprint. Can you beat it?`, url:link}).catch(()=>{});
  const rf = m.querySelector("#refresh"); if (rf) rf.onclick = ()=>openChallenge(ch.id);
  m.querySelector("#menu").onclick = ()=>{ endSprintView(); setChallengeParam(null); setupScreen(""); };
  m.querySelector("#again").onclick = ()=>{ endSprintView(); setChallengeParam(null); settings.mode = "challenge"; setupScreen(""); };
}

/* ---- "Your challenges" list in the menu ---- */
async function fillChallengeList(listEl){
  const items = chList().slice(0, 8);
  if (!items.length){ listEl.innerHTML = `<li class="empty">None yet.</li>`; return; }
  listEl.innerHTML = items.map(x=>`<li data-id="${x.id}"><span class="sp">Loading…</span></li>`).join("");
  await Promise.all(items.map(async x=>{
    let text, li = listEl.querySelector(`li[data-id="${x.id}"]`);
    try {
      const r = await chRequest({action:"challengeGet", id:x.id, token:x.token});
      const ch = r.challenge, role = ch.you, me = role && ch[role], opp = role && ch[role==="creator"?"challenger":"creator"];
      const vs = opp ? `vs ${esc(opp.name)}` : "no opponent yet";
      let status;
      if (ch.result) status = ch.result.winner === "tie" ? `Tie, ${me.score}–${opp.score}` : (ch.result.winner === role ? `Won ${me.score}–${opp.score}` : `Lost ${me.score}–${opp.score}`);
      else if (me && me.status !== "done") status = me.status === "playing" ? "In progress" : "Ready to play";
      else status = opp ? `Waiting for ${esc(opp.name)}` : "Waiting for a friend";
      text = `<b>${mins(ch.minutes)}</b> <span class="tag">${esc((DECK_DEFS[ch.deck]||DECK_DEFS.sat).tag)}</span> ${vs}<span class="sp"></span><span class="tag">${status}</span>`;
    } catch (e) {
      if (e.code === "no_challenge"){ chSave(chList().filter(y=>y.id!==x.id)); if (li) li.remove(); return; }
      text = `<span class="sp">Couldn't load</span>`;
    }
    li = listEl.querySelector(`li[data-id="${x.id}"]`);
    if (li){ li.innerHTML = text; li.onclick = ()=>openChallenge(x.id); }
  }));
  if (!listEl.children.length) listEl.innerHTML = `<li class="empty">None yet.</li>`;
}

function updateFoot(){
  document.getElementById("foot").textContent = `Word Rally \u00B7 ${WORDS.length} ${DECK.short}${WORD_SOURCE && DECK_ID==="sat" ?" (from "+WORD_SOURCE+")":""} \u00B7 ${STORAGE_OK ? `progress saved in this browser for ${settings.name}` : "progress lasts until you close the page"}`;
  const tag = document.getElementById("deckTag"); if (tag) tag.textContent = DECK.tag;
}
let WORD_SOURCE = "";
// On a web host, a words.json next to this page overrides the built-in list (same fields as the built-in data).
(async function loadExternalWords(){
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch("words.json", {cache:"no-cache"});
    if (!r.ok) return;
    const data = await r.json();
    const ok = Array.isArray(data) && data.length >= 8 &&
      data.every(e => e && e.word && e.pos && e.definition && e.contextSentence && e.clozeSentence && e.description);
    if (ok && !G){ DECK_DATA.sat = data; WORD_SOURCE = "words.json"; if (DECK_ID === "sat") WORDS = toBank(data); updateFoot(); }
  } catch (e) { /* no words.json (or opened from disk): use the built-in list */ }
})();
updateFoot();
// Back in a room after a reload? Rejoin it. Otherwise open the menu (a ?room=CODE link pre-fills the code).
NET.session = sessLoad();
if (PAGE_PARAMS.get("challenge") && serverUrl()){
  NET.session = null;
  openChallenge(PAGE_PARAMS.get("challenge").toLowerCase());
} else if (NET.session && serverUrl()){
  openModal(`<h2>Reconnecting…</h2><p class="sub">Rejoining room ${esc(NET.session.code)}.</p>`, "", "connecting");
  netOpen(null);
} else {
  NET.session = null;
  setupScreen(PAGE_PARAMS.get("room") || "");
}
</script>
</body>
</html>
