<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Rally</title>
<meta name="description" content="A race game for learning SAT vocabulary with an adaptive question engine.">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface2:#faf9f6; --ink:#1c1b18; --muted:#6a665d; --line:#e2ddd2;
  --accent:#2f62e0; --accentInk:#ffffff; --good:#1d8049; --goodBg:#e6f4ec; --bad:#c03a26; --badBg:#fbe9e5;
  --gold:#b7800f; --track:#ece8df; --tick:rgba(0,0,0,.07); --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --p0:#2f62e0; --p1:#e0582a; --p2:#14967f; --p3:#9050b8; --p4:#c2357a; --p5:#6f7f12;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131418; --surface:#1d1e24; --surface2:#24252c; --ink:#ebeae5; --muted:#9b988f; --line:#33343c;
    --accent:#6b93ff; --accentInk:#0d1020; --good:#4cc47f; --goodBg:#16301f; --bad:#ff7a63; --badBg:#3a1c17;
    --gold:#e2b04a; --track:#26272e; --tick:rgba(255,255,255,.06); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --p0:#6b93ff; --p1:#ff8a5c; --p2:#3fcdb2; --p3:#c38cf0; --p4:#f27bb5; --p5:#b9cf4c;
  }
}
:root[data-theme="dark"]{
  --bg:#131418; --surface:#1d1e24; --surface2:#24252c; --ink:#ebeae5; --muted:#9b988f; --line:#33343c;
  --accent:#6b93ff; --accentInk:#0d1020; --good:#4cc47f; --goodBg:#16301f; --bad:#ff7a63; --badBg:#3a1c17;
  --gold:#e2b04a; --track:#26272e; --tick:rgba(255,255,255,.06); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --p0:#6b93ff; --p1:#ff8a5c; --p2:#3fcdb2; --p3:#c38cf0; --p4:#f27bb5; --p5:#b9cf4c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo span{color:var(--accent)}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

/* Track */
.track{padding:14px 16px 10px}
.trackHead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 0 6px 92px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.lane{display:flex;align-items:center;gap:10px;height:44px}
.laneName{width:82px;flex:none;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.laneName small{display:block;font-weight:500;color:var(--muted);font-size:11px;line-height:1.1}
.road{position:relative;flex:1;height:30px;border-radius:15px;background:var(--track);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--cell) - 1px),var(--tick) calc(var(--cell) - 1px) var(--cell));}
.road::after{content:"";position:absolute;right:0;top:0;bottom:0;width:10px;border-radius:0 15px 15px 0;
  background:repeating-linear-gradient(0deg,var(--ink) 0 5px,var(--surface) 5px 10px);opacity:.55}
.token{position:absolute;top:1px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff;left:calc((100% - 38px) * var(--p));transition:left .55s cubic-bezier(.3,1.3,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2}
.token.me{outline:3px solid var(--surface);outline-offset:-1px}
.badges{position:absolute;top:-9px;left:calc((100% - 38px) * var(--p) + 20px);display:flex;gap:1px;font-size:12px;transition:left .55s;z-index:3;pointer-events:none}
.badges b{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 3px;line-height:15px;font-size:11px}
.lane.targetable .road{outline:2px dashed var(--bad);outline-offset:2px;cursor:pointer}
.float{position:absolute;top:-4px;font-weight:800;font-size:15px;pointer-events:none;z-index:5;animation:rise 1.3s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Main grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-top:14px;align-items:start}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .track{position:sticky;top:0;z-index:20;padding:8px 12px 6px;border-radius:0 0 14px 14px}
  .lane{height:32px}
  .road{height:24px}
  .token{width:22px;height:22px;font-size:10px;top:1px}
  .trackHead{margin-bottom:2px}
  /* On phones, cards you hold sit above the question so they're never out of sight. */
  .grid > .side{display:contents}
  .grid > .qcard{order:2}
  .grid .side .panel{order:3}
  .grid .side .handPanel.hasCards{order:1}
  .handPanel.hasCards .hand{grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);overflow-x:auto}
}

/* Question */
.qcard{padding:20px 22px 22px;min-height:360px}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chip.review{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:var(--badBg)}
.chip.frozen{color:#2b8fd6;border-color:#9fd0f2}
.stageDots{display:inline-flex;gap:3px;margin-left:auto;align-items:center;font-size:11px;color:var(--muted)}
.stageDots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.stageDots i.on{background:var(--accent)}
.stem{font-size:19px;line-height:1.5;margin:4px 0 16px}
.stem .big{font-size:30px;font-weight:800;letter-spacing:-.01em;display:block;margin-bottom:2px}
.stem blockquote{margin:0 0 12px;padding:12px 16px;border-left:4px solid var(--accent);background:var(--surface2);border-radius:0 10px 10px 0;font-size:18px}
.stem mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:4px;padding:0 3px;font-weight:700}
.blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--ink);margin:0 2px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--goodBg)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--badBg)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.5}
.feedback{margin-top:14px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface2)}
.feedback h3{margin:0 0 4px;font-size:16px}
.feedback.ok h3{color:var(--good)} .feedback.no h3{color:var(--bad)}
.feedback p{margin:4px 0}
.feedback .ex{color:var(--muted);font-style:italic}
.fbRow{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.fbRow .hint{font-size:12px;color:var(--muted)}
.waiting{color:var(--muted);text-align:center;padding:60px 0;font-weight:600}

/* Side */
.side{display:grid;gap:14px}
.side .panel{padding:14px 16px}
.side h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.streak{display:flex;gap:6px}
.pip{flex:1;height:12px;border-radius:6px;background:var(--track);position:relative}
.pip.on{background:var(--accent)}
.pip.m3::after,.pip.m5::after{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap}
.pip.m3::after{content:"attack"} .pip.m5::after{content:"power"}
.pip.m5.on{background:var(--gold)}
.streakNote{height:16px}
.hand{display:grid;gap:8px}
.card{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);padding:9px 10px}
.card .ic{font-size:22px;line-height:1}
.card .nm{font-weight:800}
.card .nm em{font-weight:500;font-style:italic;color:var(--muted);font-size:12px;margin-left:4px}
.card .gl{font-size:12px;color:var(--muted);font-style:italic}
.card .ef{font-size:13px}
.card.power{border-color:var(--gold)}
.card.power .nm{color:var(--gold)}
button.card:hover:not(:disabled){border-color:var(--accent)}
button.card:disabled{opacity:.55;cursor:default}
.empty{font-size:13px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:230px;overflow:auto}
.log li{padding:5px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border:0}
.log .who{font-weight:700}
.log li.fresh{animation:flash 1s}
@keyframes flash{from{background:color-mix(in srgb,var(--accent) 14%,transparent)}to{background:transparent}}

.labSearch{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);margin:0 0 10px}
.src{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--muted);margin-right:3px}
.posTag{font-weight:400;color:var(--muted);font-size:11px;font-style:italic}

/* Online */
.timer{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin:-4px 0 14px}
.timer > span{display:block;height:100%;width:100%;background:var(--accent);transition:width .2s linear}
.timer > span.low{background:var(--bad)}
.secsLeft{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:14px}
.opt.pending{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.reveal{text-align:center;padding:26px 0 10px;color:var(--muted);font-weight:600}
.reveal .cd{font-size:56px;font-weight:800;color:var(--ink);line-height:1.1}
.revealHead{margin:14px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.roomCode{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;color:var(--accent)}
.joinRow{display:flex;gap:8px}
.joinRow input{flex:1;min-width:0;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
#code{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;max-width:160px}
.lobbyHead{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.lobbyList,.standings{list-style:none;margin:0 0 14px;padding:0}
.lobbyList li,.standings li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.standings li .sp{flex:1}
.tag{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.note{background:var(--surface2);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px}
[hidden]{display:none!important}

.deckTag{font-size:12px;font-weight:700;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:999px;padding:2px 9px}
.feedback .corr{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--gold) 14%,transparent)}

/* Challenge sprint */
body.sprint .track, body.sprint .side{display:none}
body.sprint .grid{grid-template-columns:1fr;max-width:760px;margin:14px auto 0}
.sprintBar{display:flex;gap:10px;margin-bottom:10px}
.sprintBar div{flex:1;background:var(--surface2);border-radius:12px;padding:8px 12px;text-align:center}
.sprintBar b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.sprintBar span{font-size:12px;color:var(--muted)}
.chList li{cursor:pointer}
.chList li:hover b{color:var(--accent)}
.chList li .sp{flex:1}
.chList li.empty{cursor:default;color:var(--muted)}

/* Toasts & rivals' turn */
.toasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:70;display:grid;gap:6px;width:min(460px,calc(100% - 24px));pointer-events:none}
.toast{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px;
  box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:15px;animation:tin .25s ease-out;transition:opacity .3s,transform .3s}
.toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)} .toast.info{border-left-color:var(--accent)}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.turnEvents{list-style:none;margin:6px 0 0;padding:0;font-size:16px}
.turnEvents li{padding:9px 0;border-bottom:1px solid var(--line);animation:fade .25s}
.turnEvents li.pending{color:var(--muted);border:0}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,10,15,.5);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.modal.wide{width:min(820px,100%)}
.modal h2{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
.modal .sub{color:var(--muted);margin:0 0 16px}
.choices{display:grid;gap:10px}
.choices .card{padding:12px 14px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface2);padding:9px 6px;font-size:14px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accentInk)}
.rules{font-size:14px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:12px 14px;margin:6px 0 16px}
.rules ul{margin:6px 0 0;padding-left:18px}
.rowEnd{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.targets{display:grid;gap:8px}
.tgt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);text-align:left}
.tgt:hover{border-color:var(--bad)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.tgt .sp{flex:1}
.tgt small{color:var(--muted)}
table.lab{width:100%;border-collapse:collapse;font-size:14px}
table.lab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:-22px;background:var(--surface)}
table.lab td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.lab td.w{font-weight:700}
.hist{display:inline-flex;gap:3px}
.hist i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hist .h1{background:var(--good)} .hist .h0{background:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--track);width:90px;display:inline-block;vertical-align:middle;margin-right:6px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent)}
.bar.hot > span{background:var(--bad)}
.mult{font-variant-numeric:tabular-nums;font-weight:700}
.stat{display:flex;gap:12px;margin:12px 0}
.stat div{flex:1;background:var(--surface2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}
.missList{margin:0;padding-left:18px}
.missList li{margin:3px 0}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:22px 0 6px}
@media (max-width:520px){
  .wrap{padding:12px}
  .laneName{width:58px;font-size:13px}
  .trackHead{margin-left:68px}
  .qcard{padding:16px}
  .stem{font-size:17px} .stem .big{font-size:26px} .stem blockquote{font-size:16px}
  header .btn{padding:7px 10px;font-size:13px}
  .hideSm{display:none}
}
</style>
</head>
<body>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="wrap">
  <header>
    <div class="logo">Word<span>Rally</span></div>
    <span class="deckTag" id="deckTag"></span>
    <div class="sp"></div>
    <button class="btn" id="labBtn">Word Lab</button>
    <button class="btn" id="newBtn">New race</button>
  </header>

  <section class="panel track" id="track" aria-label="Race track"></section>

  <div class="grid">
    <section class="panel qcard" id="qcard" aria-live="polite"></section>
    <aside class="side">
      <div class="panel">
        <h4>Your streak</h4>
        <div class="streak" id="streak"></div>
        <div class="streakNote"></div>
      </div>
      <div class="panel handPanel" id="handPanel">
        <h4>Your attacks <span class="hideSm" style="text-transform:none;letter-spacing:0;font-weight:500">(click to use)</span></h4>
        <div class="hand" id="hand"></div>
      </div>
      <div class="panel">
        <h4>Race log</h4>
        <ul class="log" id="log"></ul>
      </div>
    </aside>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------
   WORD BANK
   Each word carries four retrieval contexts:
     def      - "X most nearly means..."            (word -> meaning)
     ctx      - word used in a sentence -> meaning  (word in context -> meaning)
     cloze    - a different sentence with a blank   (context -> word)
     desc     - a description of the idea           (meaning -> word)
------------------------------------------------------------------- */
// 476 words drawn from three lists built from official and reported digital SAT material
// (PrepScholar, MathChops, The Test Advantage). Definitions and sentences are original.

iption":"Which word describes something absolutely essential or necessary?","confusables":["beneficial","critical","imperative","mandatory","operative","paramount"],"multiSense":false,"sources":["prepscholar"]},{"word":"vivid","pos":"adj","definition":"bright and strikingly clear","contextSentence":"The author's vivid descriptions of the market, full of spices, colors, and shouting merchants, made readers feel present.","clozeSentence":"Years later, she still had ___ memories of her first day of school, recalling every color and sound.","description":"Which word describes an image or memory that is bright, detailed, and strikingly clear?","confusables":["distinct","lucid","stark","tangible"],"multiSense":false,"sources":["mathchops"]},{"word":"volatile","pos":"adj","definition":"likely to change suddenly and unpredictably","contextSentence":"The stock market was volatile that year, with prices soaring one week and collapsing the next.","clozeSentence":"The political situation remained ___, and diplomats feared that a single incident could spark open conflict.","description":"Which word describes a situation likely to change suddenly or explode without warning?","confusables":["dynamic","erratic","precarious","vacillating","variable"],"multiSense":true,"sources":["prepscholar","testadvantage"]},{"word":"waive","pos":"verb","definition":"to set aside a right, rule, or fee","contextSentence":"The museum waived its entrance fee on holidays so that every family could visit for free.","clozeSentence":"The college agreed to ___ the application fee for students whose families could not afford to pay it.","description":"Which word means to choose not to enforce a rule, fee, or right?","confusables":["abstain","dismiss","disregard","forfeiture","renounce"],"multiSense":false,"sources":["prepscholar"]},{"word":"warranted","pos":"adj","definition":"justified; having good reason","contextSentence":"Given the storm forecasts, the principal's decision to close school early was entirely warranted.","clozeSentence":"The teacher's concern was ___: the students who skipped the review session did poorly on the exam.","description":"Which word describes an action or feeling that is justified by the circumstances?","confusables":["appropriate","legitimate","plausible"],"multiSense":false,"sources":["prepscholar"]},{"word":"withdraw","pos":"verb","definition":"to pull back or remove","contextSentence":"After injuring her ankle, the runner chose to withdraw from the competition so that she could recover fully.","clozeSentence":"Facing heavy losses, the general decided to ___ his troops from the valley before the enemy surrounded them.","description":"Which word means to pull back or take something away from a place or situation?","confusables":["abstain","disengage","isolate","recant","renounce"],"multiSense":false,"sources":["prepscholar"]},{"word":"yield","pos":"verb","definition":"to produce; also, to give way","contextSentence":"The new farming techniques yielded twice as much corn per acre as the methods used a decade earlier.","clozeSentence":"Drivers must ___ to pedestrians at the crosswalk, stopping completely until everyone has safely crossed.","description":"Which word means to produce a result or crop, or to give way under pressure?","confusables":["concede","conform","engender","succumb"],"multiSense":true,"sources":["testadvantage"]}];

const BIO2B_DATA = [{"word":"phospholipid","pos":"structure","definition":"a lipid with a polar phosphate-glycerol head and two nonpolar fatty acid tails","contextSentence":"Because each phospholipid is amphipathic, these molecules arrange themselves in water so their hydrophilic heads face the cytosol and the extracellular fluid.","clozeSentence":"A typical ___ in the plasma membrane has a negatively charged phosphate group attached to glycerol and two hydrocarbon tails, often one straight and one kinked.","description":"A lipid dropped into water self-assembles into a two-layered sheet, with its charged head regions touching water and its two hydrocarbon chains hidden inside. What type of molecule is it?","confusables":["phospholipid bilayer"],"sourcePages":[3,4,6,7,16,17],"correction":null},{"word":"phospholipid bilayer","pos":"structure","definition":"two sheets of phosphate-headed lipids, heads toward water and nonpolar tails facing inward","contextSentence":"Oxygen and carbon dioxide cross the phospholipid bilayer by simple diffusion, but ions like Na+ cannot pass its nonpolar interior without help from proteins.","clozeSentence":"Its hydrophobic interior makes the ___ a barrier to ions, while its two rows of polar heads face the cytosol and the extracellular fluid.","description":"A membrane's core blocks Na+ and glucose but lets O2 slip through, while both of its outer surfaces interact with water. What membrane structure accounts for this?","confusables":["phospholipid"],"sourcePages":[1,3,4,15,16,17,61,62],"correction":null},{"word":"saturated fatty acid","pos":"structure","definition":"a hydrocarbon chain with only single carbon-carbon bonds, so it is straight and packs tightly","contextSentence":"Phospholipids built with saturated fatty acid tails pack closely together, so membranes rich in them are less fluid and solidify at a higher temperature.","clozeSentence":"Having no carbon-carbon double bonds, each ___ tail lies straight, letting neighboring phospholipids pack tightly and reducing membrane fluidity.","description":"Bacteria moved to a warmer temperature start building membrane lipids whose tails lack C=C double bonds and pack tightly, keeping the membrane from becoming too fluid. What kind of tail are they making more of?","confusables":[],"sourcePages":[3,4,6,7,16,17,18],"correction":null},{"word":"unsaturated fatty acid","pos":"structure","definition":"a hydrocarbon chain with one or more C=C double bonds that put kinks in it","contextSentence":"Cold-water fish keep their membranes fluid by using phospholipids with unsaturated fatty acid tails, whose kinks keep the lipids from packing tightly.","clozeSentence":"Kinks caused by carbon-carbon double bonds in each ___ tail keep phospholipids from packing tightly, which increases membrane fluidity.","description":"A plant exposed to cold begins making membrane lipids with more carbon-carbon double bonds in their tails, which keeps its membranes from solidifying. What kind of tail is it making more of?","confusables":[],"sourcePages":[3,4,6,7,16,17,18],"correction":null},{"word":"integral protein","pos":"structure","definition":"a protein that penetrates the bilayer's hydrophobic core, held there by nonpolar amino acids","contextSentence":"Like other pumps, the sodium-potassium pump is an integral protein: hydrophobic amino acids on its surface hold it within the nonpolar interior of the bilayer.","clozeSentence":"Whether it spans the whole membrane or reaches only partway in, any ___ has hydrophobic regions inserted into the nonpolar core of the bilayer.","description":"A membrane protein can be removed only with detergents that break up the bilayer, yet it extends only partway into the hydrophobic core rather than all the way across. What kind of membrane protein is it?","confusables":["aquaporin","carrier protein","channel protein","cotransporter","glycoprotein","proton pump","receptor protein","sodium-potassium pump","transmembrane protein"],"sourcePages":[3,5,8,15,17,18,19,71,72],"correction":null},{"word":"transmembrane protein","pos":"structure","definition":"a protein that spans the entire bilayer, exposed on both faces of the membrane","contextSentence":"Aquaporins are transmembrane proteins: their hydrophobic middle contacts the fatty acid tails, while their ends stick out into both the cytosol and the extracellular fluid.","clozeSentence":"Whatever its function, any integral protein whose chain crosses the entire hydrophobic core, with parts exposed on both faces of the membrane, fits the structural category of ___.","description":"A membrane protein has a nonpolar middle segment buried in the bilayer and polar regions exposed both inside and outside the cell. What structural category does it belong to?","confusables":["aquaporin","carrier protein","channel protein","cotransporter","glycoprotein","integral protein","proton pump","receptor protein","sodium-potassium pump"],"sourcePages":[3,5,8,15,17,18,19,20],"correction":null},{"word":"peripheral protein","pos":"structure","definition":"a protein loosely bound to the membrane surface or to an integral protein, outside the core","contextSentence":"A peripheral protein on the cytoplasmic side can link the membrane to the cytoskeleton, yet a gentle salt wash is enough to detach it.","clozeSentence":"Mild salt washes strip off each ___ because it sits on the membrane surface or binds exposed parts of integral proteins without entering the hydrophobic core.","description":"A protein is released from a membrane by a gentle salt wash that leaves the bilayer intact, and it has almost no hydrophobic surface. What type of membrane protein is it?","confusables":[],"sourcePages":[1,3,5,8,15,17,18,19],"correction":null},{"word":"glycoprotein","pos":"structure","definition":"a membrane protein with carbohydrate chains covalently attached, often acting as an ID tag","contextSentence":"Immune cells recognize foreign cells partly by the carbohydrate chains on a glycoprotein projecting from the cell surface, which acts like an identification tag.","clozeSentence":"In the fluid mosaic model, each ___ is a protein with sugar chains attached that face outward and help cells recognize one another.","description":"A cell-surface molecule is destroyed by a protein-digesting enzyme, releasing the sugar chains it carried. Before treatment, it helped immune cells identify the cell as self. What was this molecule?","confusables":["integral protein","receptor protein","transmembrane protein"],"sourcePages":[1,15,18,19],"correction":null},{"word":"glycolipid","pos":"structure","definition":"a membrane lipid with a carbohydrate chain attached, facing the outside of the cell","contextSentence":"On red blood cells, some ABO blood-group sugars are carried on a glycolipid, so a lipid as well as proteins helps mark the cell's identity.","clozeSentence":"Each ___ is a lipid, not a protein, that carries a sugar chain on the membrane's outer surface and helps cells recognize each other.","description":"A protease treatment strips every surface protein from a cell, yet carbohydrate ID tags remain on its outer surface, anchored to lipids. What molecules carry these remaining tags?","confusables":[],"sourcePages":[1,15,18,19],"correction":null},{"word":"cholesterol","pos":"structure","definition":"a steroid in animal cell membranes that buffers fluidity at high and low temperatures","contextSentence":"At body temperature cholesterol restrains phospholipid movement, but in the cold it keeps phospholipids from packing tightly and solidifying.","clozeSentence":"Wedged between phospholipids in animal cell membranes, the steroid ___ reduces fluidity when warm and prevents solidification when cold.","description":"Animal cell membranes resist large changes in fluidity across a range of temperatures thanks to a four-ringed lipid tucked among the phospholipid tails. What is this molecule?","confusables":[],"sourcePages":[1,3,4,15,16,18],"correction":"Notes said cells communicate by using cholesterol to release and capture chemicals; correct: cholesterol regulates membrane fluidity, while cells signal by releasing molecules that bind specific receptor proteins."},{"word":"channel protein","pos":"structure","definition":"a transmembrane protein forming a hydrophilic pore that lets specific ions or water pass","contextSentence":"Potassium ions cross the membrane through a channel protein, moving down their gradient by facilitated diffusion without the protein changing shape for each ion.","clozeSentence":"Unlike a carrier, each ___ forms an open hydrophilic pore and does not need to change shape for each ion that passes through it down its gradient.","description":"A membrane protein lets millions of K+ ions per second flow down their gradient through a water-filled pore, without a shape change for each ion. What kind of protein is it?","confusables":["aquaporin","integral protein","transmembrane protein"],"sourcePages":[15,17,20,22,23,26,27,28,29,30,31,32,33],"correction":null},{"word":"carrier protein","pos":"structure","definition":"a transport protein that binds a specific solute and changes shape to move it across","contextSentence":"Glucose enters red blood cells through a GLUT carrier protein, which binds the glucose and changes conformation to release it on the other side.","clozeSentence":"GLUT transporters move glucose by facilitated diffusion: each ___ binds a glucose molecule, changes shape, and releases it on the opposite side.","description":"A membrane protein moves glucose down its gradient, but the rate levels off at high glucose because each protein must bind a molecule and change shape. What type of transport protein is it?","confusables":["cotransporter","integral protein","proton pump","sodium-potassium pump","transmembrane protein"],"sourcePages":[20,31,32,33,35],"correction":"Notes listed glucose as moving through a channel protein and ions through a carrier protein; correct: glucose crosses via carrier proteins such as GLUT, while ions usually pass through ion channels."},{"word":"aquaporin","pos":"structure","definition":"a channel protein that lets water molecules cross the membrane rapidly","contextSentence":"When ADH is released, kidney collecting duct cells insert more aquaporin channels into their membranes, so more water is reabsorbed into the blood.","clozeSentence":"Peter Agre won the 2003 Nobel Prize for discovering the ___, a water-specific channel that lets water cross membranes far faster than through the bilayer.","description":"A drug blocks one membrane protein in kidney collecting duct cells; water still crosses those membranes but much more slowly, and the urine becomes more dilute. What protein was blocked?","confusables":["channel protein","integral protein","transmembrane protein"],"sourcePages":[20,26,27,28,29,30,31,32,33],"correction":null},{"word":"sodium-potassium pump","pos":"structure","definition":"an ATP-powered pump moving 3 Na+ out of and 2 K+ into the cell per cycle","contextSentence":"Each cycle of the sodium-potassium pump hydrolyzes one ATP, sending three Na+ out and two K+ in, which helps keep the cytoplasm negative relative to the outside.","clozeSentence":"Phosphorylation by ATP changes the shape of the ___, so it releases three Na+ outside the cell and then binds two K+ from the extracellular fluid.","description":"After a neuron's ATP supply is poisoned, Na+ slowly builds up inside, K+ leaks out, and the membrane potential fades. Which membrane protein stopped working?","confusables":["carrier protein","integral protein","transmembrane protein"],"sourcePages":[26,27,28,29,30,32,33,35,71,72,73,74],"correction":null},{"word":"proton pump","pos":"structure","definition":"a membrane pump that uses energy, such as from ATP, to move H+ ions against their gradient","contextSentence":"In plant cells, a proton pump uses ATP to push H+ out of the cell, building a gradient that later powers sucrose uptake.","clozeSentence":"By hydrolyzing ATP to move H+ out of plant cells, the ___ stores potential energy in an H+ gradient that cotransporters later use.","description":"A plant cell's sucrose uptake soon stops when its ATP runs out, even though the H+/sucrose transporter itself never uses ATP directly. Which protein's failure explains this?","confusables":["carrier protein","integral protein","transmembrane protein"],"sourcePages":[73,74,75],"correction":null},{"word":"cotransporter","pos":"structure","definition":"a transport protein that couples one solute's downhill flow to another's uphill movement","contextSentence":"In plant cells, an H+/sucrose cotransporter lets H+ flow back in down its gradient while carrying sucrose into the cell against its gradient.","clozeSentence":"In intestinal cells, Na+ diffusing inward through the Na+/glucose ___ carries glucose in with it, which is why oral rehydration solution contains both salt and glucose.","description":"A transport protein has no ATP-binding site, yet it moves sucrose into a cell against a steep gradient, but only while H+ is flowing inward through it. What is this protein?","confusables":["carrier protein","cotransport","integral protein","transmembrane protein"],"sourcePages":[75],"correction":null},{"word":"receptor protein","pos":"structure","definition":"a membrane protein that binds a specific signal molecule and triggers a cell response","contextSentence":"When insulin binds a receptor protein on a muscle cell, the signal is relayed inside and the cell takes up more glucose.","clozeSentence":"Signal transduction begins when a ligand such as insulin binds its specific ___ on the cell surface, changing that protein's shape.","description":"A hormone never enters its target cells, yet it triggers a response inside them, and cells lacking one particular surface protein ignore it completely. What protein do they lack?","confusables":["glycoprotein","integral protein","transmembrane protein"],"sourcePages":[18,19,22,34,35],"correction":null},{"word":"cell wall","pos":"structure","definition":"a rigid, mostly polysaccharide layer outside the plasma membrane that resists osmotic bursting","contextSentence":"A plant cell in pure water swells until its membrane presses against the cell wall, which resists further expansion, so the cell becomes turgid instead of bursting.","clozeSentence":"Fungi build their ___ from chitin and plants build theirs from cellulose, giving both a rigid boundary outside the plasma membrane.","description":"Penicillin blocks peptidoglycan synthesis, so growing bacteria in a hypotonic environment swell and burst. What structure is penicillin preventing them from building?","confusables":[],"sourcePages":[9,10,12,46,47,65],"correction":null},{"word":"contractile vacuole","pos":"structure","definition":"an organelle in freshwater protists that collects excess water and expels it from the cell","contextSentence":"As the salinity around a Paramecium rises, its contractile vacuole contracts less often because less water enters the cell by osmosis.","clozeSentence":"A freshwater Paramecium is hypertonic to pond water, so each ___ must repeatedly pump out the water that keeps entering by osmosis.","description":"A freshwater protist is moved into a solution isotonic to its cytoplasm, and an organelle that was rhythmically filling and emptying slows nearly to a stop, saving ATP. What organelle is it?","confusables":[],"sourcePages":[42,43,44,50],"correction":null},{"word":"central vacuole","pos":"structure","definition":"a large water-filled, membrane-bound sac in plant cells whose swelling creates turgor","contextSentence":"When wilted lettuce is soaked in water, each cell's central vacuole fills by osmosis and pushes the membrane against the cell wall, making the leaves crisp.","clozeSentence":"When a plant cell is placed in a hypotonic solution, water enters its large ___, increasing cell volume and pressing the membrane against the cell wall.","description":"In a plasmolyzed onion cell, the membrane-bound compartment that normally fills most of the cell's volume has shrunk dramatically. What compartment is it?","confusables":[],"sourcePages":[10,11,41,45],"correction":null},{"word":"vesicle","pos":"structure","definition":"a small membrane-bound sac that carries materials within, into or out of a cell","contextSentence":"During exocytosis, a vesicle carrying insulin fuses with the plasma membrane and releases the hormone outside the pancreatic cell.","clozeSentence":"In pinocytosis, the plasma membrane folds inward and pinches off as a small ___ containing extracellular fluid and dissolved solutes.","description":"Researchers count small membrane-bound sacs inside an amoeba before and after adding bacteria, expecting the count to rise if the amoeba feeds by endocytosis. What structures are being counted?","confusables":[],"sourcePages":[21,22,34,35],"correction":null},{"word":"passive transport","pos":"process","definition":"net movement of substances down their concentration gradient with no input of metabolic energy","contextSentence":"Oxygen entering a cell and glucose moving through GLUT proteins are both examples of passive transport, because each moves from higher to lower concentration without ATP.","clozeSentence":"Simple diffusion, facilitated diffusion and osmosis are all forms of ___, because the energy driving them comes from the gradient itself rather than from ATP.","description":"Cells whose ATP production is blocked still take in O2 through the bilayer, glucose through GLUT proteins and water through aquaporins, all down their gradients. What general type of transport is still working?","confusables":["facilitated diffusion","osmosis","simple diffusion"],"sourcePages":[21,22,23,24,25,30,31,48,49],"correction":null},{"word":"simple diffusion","pos":"process","definition":"movement of a substance directly through the lipid bilayer, down its gradient, without proteins","contextSentence":"Small nonpolar gases such as O2 and CO2 cross the plasma membrane by simple diffusion, slipping between phospholipids without any transport protein.","clozeSentence":"Like facilitated diffusion, ___ is a form of passive transport, but it moves small nonpolar molecules such as O2 directly through the bilayer without proteins.","description":"A new drug enters cells at a rate proportional to its outside concentration that never levels off, and protein inhibitors and ATP depletion have no effect. How does it most likely cross the membrane?","confusables":["passive transport"],"sourcePages":[9,10,13,14,15,31,32,33,48,49],"correction":"Notes labeled sugar movement as simple diffusion; correct: sugars like glucose are polar and cross membranes by facilitated diffusion through transport proteins, which is still passive."},{"word":"facilitated diffusion","pos":"process","definition":"passive movement of a solute down its gradient through a channel or carrier protein","contextSentence":"Glucose enters most body cells by facilitated diffusion through GLUT carriers, so it moves in only while it is more concentrated outside the cell.","clozeSentence":"Like simple diffusion, ___ requires no ATP, but it depends on channel or carrier proteins to move ions and large polar molecules down their gradients.","description":"A polar sugar enters cells only while it is more concentrated outside; its uptake rate levels off at high concentrations, and blocking ATP production has no effect. What process moves it?","confusables":["passive transport"],"sourcePages":[21,22,26,27,28,29,30,31,32,33,48,49],"correction":"Notes said molecules that need transport proteins use ATP and undergo active transport; correct: facilitated diffusion uses transport proteins without ATP, and only movement against a gradient requires energy."},{"word":"osmosis","pos":"process","definition":"diffusion of water across a selectively permeable membrane toward lower water potential","contextSentence":"When a slug is covered in salt, water leaves its tissues by osmosis, moving toward the lower water potential outside its body.","clozeSentence":"Sucrose cannot cross dialysis tubing, so a bag of 1 M sucrose placed in 0.5 M sucrose gains mass as water enters by ___.","description":"A potato core placed in pure water gains mass even though no sugar enters or leaves it. What process accounts for the gain in mass?","confusables":["passive transport"],"sourcePages":[21,22,31,32,33,36,37,45,48,49,58,59,60],"correction":"Notes defined osmosis as just the movement of water; correct: osmosis is the diffusion of water across a selectively permeable membrane, from higher to lower water potential."},{"word":"active transport","pos":"process","definition":"movement of a substance against its concentration gradient by a membrane protein, using energy","contextSentence":"Stomach lining cells secrete H+ by active transport, using ATP to concentrate acid in the stomach far above its level in the blood.","clozeSentence":"Membrane proteins that change conformation and move a solute from low to high concentration while hydrolyzing ATP are carrying out ___.","description":"A cell keeps taking in K+ even though K+ is already about 30 times more concentrated inside, but the uptake stops as soon as its ATP is depleted. What kind of transport is this?","confusables":["cotransport"],"sourcePages":[21,22,23,24,25,32,33,35,48,49,71,72],"correction":null},{"word":"cotransport","pos":"process","definition":"using one solute's downhill flow to drive another solute uphill through the same protein","contextSentence":"Oral rehydration therapy works through cotransport: intestinal cells absorb Na+ and glucose together, and water then follows by osmosis.","clozeSentence":"Because H+ and sucrose must travel together through one protein, sucrose uptake into plant cells by ___ stops whenever the H+ gradient collapses.","description":"Glucose is absorbed into intestinal cells against its gradient only when Na+ is present outside, and the transporter involved never hydrolyzes ATP. What process is this?","confusables":["active transport","cotransporter"],"sourcePages":[75],"correction":null},{"word":"bulk transport","pos":"process","definition":"energy-requiring movement of large particles or large amounts of material using vesicles","contextSentence":"Bulk transport lets white blood cells take in whole bacteria and lets pancreatic cells release large amounts of insulin, using vesicles rather than transport proteins.","clozeSentence":"Endocytosis and exocytosis are the two forms of ___, which use vesicles and energy to move large molecules or large quantities across the membrane.","description":"A cell must bring in whole bacteria and also send out large batches of digestive enzymes, using membrane-enclosed sacs rather than transport proteins. What general category of transport covers both?","confusables":["endocytosis","exocytosis","phagocytosis","pinocytosis","receptor-mediated endocytosis"],"sourcePages":[34,35,48,49],"correction":null},{"word":"endocytosis","pos":"process","definition":"uptake of material by folding the plasma membrane inward to form a new vesicle","contextSentence":"An Acanthamoeba feeding on bacteria uses endocytosis, so the number of vesicles inside the cell rises after bacteria are added.","clozeSentence":"Phagocytosis, pinocytosis and receptor-mediated uptake are all types of ___, in which the plasma membrane folds inward to form new vesicles.","description":"Each time an amoeba takes in a bacterium, its plasma membrane surface area shrinks slightly while a new internal vesicle appears. What general process is occurring?","confusables":["bulk transport","phagocytosis","pinocytosis","receptor-mediated endocytosis"],"sourcePages":[21,22,34,35,48,49],"correction":null},{"word":"exocytosis","pos":"process","definition":"release of materials when an internal vesicle fuses with the plasma membrane","contextSentence":"Pancreatic beta cells secrete insulin by exocytosis: vesicles packed with the hormone fuse with the plasma membrane and empty outside the cell.","clozeSentence":"After each round of ___, the plasma membrane gains surface area, because the fused vesicle membrane becomes part of it.","description":"A neuron releases neurotransmitter molecules, and immediately afterward its plasma membrane surface area has increased slightly. What process released the neurotransmitter?","confusables":["bulk transport"],"sourcePages":[21,22,34,35],"correction":null},{"word":"phagocytosis","pos":"process","definition":"cell eating: engulfing a large solid particle into a food vacuole","contextSentence":"An amoeba captures a bacterium by phagocytosis, enclosing it in a food vacuole that then fuses with a lysosome whose enzymes digest it.","clozeSentence":"White blood cells engulf whole bacteria by ___, extending their membrane around each one rather than taking in only fluid or receptor-bound molecules.","description":"An immune cell wraps extensions of its membrane around a bacterium, and minutes later the resulting compartment merges with a lysosome. What specific process brought the bacterium in?","confusables":["bulk transport","endocytosis"],"sourcePages":[21,22,34,35,48,49],"correction":null},{"word":"pinocytosis","pos":"process","definition":"nonspecific uptake of extracellular fluid and its dissolved solutes in small vesicles","contextSentence":"During pinocytosis, a small patch of plasma membrane pinches inward, so the cell samples whatever solutes happen to be dissolved in the surrounding fluid.","clozeSentence":"Often called 'cell drinking,' ___ brings in droplets of extracellular fluid without needing any particular molecule to bind a receptor first.","description":"A cell is bathed in a dye that binds no receptors. Soon, tiny vesicles inside the cell hold dye at about the same concentration as the outside fluid. What process took in the dye?","confusables":["bulk transport","endocytosis"],"sourcePages":[21,34,35],"correction":null},{"word":"receptor-mediated endocytosis","pos":"process","definition":"uptake of specific molecules that bind membrane receptors, triggering a coated vesicle to form","contextSentence":"Cells take up cholesterol-carrying LDL particles by receptor-mediated endocytosis, concentrating them in clathrin-coated vesicles even when LDL is scarce in the blood.","clozeSentence":"In ___, ligands bind specific receptor proteins clustered in coated pits, and each pit pinches off as a clathrin-coated vesicle.","description":"Cells lacking working LDL receptors still take in fluid by vesicles but cannot efficiently import LDL cholesterol, so it builds up in the blood. Which uptake process is defective?","confusables":["bulk transport","endocytosis"],"sourcePages":[21,34,35],"correction":null},{"word":"osmoregulation","pos":"process","definition":"an organism's control of its internal water and solute balance","contextSentence":"In the kidney, osmoregulation involves ADH, which causes extra aquaporins to be inserted into collecting duct cells so more water is reabsorbed.","clozeSentence":"Freshwater Paramecium expel excess water with contractile vacuoles, while marine fish drink seawater and excrete salt through their gills; both are examples of ___.","description":"A marine fish constantly loses water to the salty sea, so it drinks seawater and actively excretes the extra salt through its gills. What process do these actions accomplish?","confusables":[],"sourcePages":[30,36,37,40,42,43,58],"correction":"Notes said molecule movement keeps solute and solvent concentrations even inside and outside the cell; correct: cells actively maintain concentration differences across the membrane and regulate water balance rather than equalizing it."},{"word":"signal transduction","pos":"process","definition":"converting an outside signal bound to a receptor into a specific response inside the cell","contextSentence":"When insulin binds its receptor on a muscle cell, signal transduction inside the cell leads to more glucose transporters in the membrane and faster glucose uptake.","clozeSentence":"In ___, a hormone that never enters the cell binds a membrane receptor and sets off a chain of events in the cytoplasm.","description":"A drug disables the inside portion of the insulin receptor but does not stop insulin from binding outside. Cells no longer increase glucose uptake. Which process has been disrupted?","confusables":[],"sourcePages":[18,19],"correction":null},{"word":"cell-cell recognition","pos":"process","definition":"cells identifying other cells by surface molecules that act as ID tags, such as glycoproteins","contextSentence":"During an infection, cell-cell recognition lets immune cells tell the body's own cells from bacteria by the glycoproteins and other molecules on their surfaces.","clozeSentence":"Glycoproteins and glycolipids on the outer membrane surface act as ID tags, allowing ___ when immune cells check whether a cell belongs to the body.","description":"After an organ transplant, the patient's immune cells attack the new organ because its cells carry unfamiliar surface glycoproteins. Which membrane function let the immune cells detect the difference?","confusables":[],"sourcePages":[1,15,18,19],"correction":null},{"word":"plasmolysis","pos":"process","definition":"shrinking of a plant cell's contents so the membrane pulls away from the wall as water leaves","contextSentence":"Red onion cells soaked in concentrated salt water show plasmolysis, and moving them back to distilled water lets their shrunken purple vacuoles refill.","clozeSentence":"In a hypertonic solution, a plant cell loses water and its plasma membrane pulls away from the cell wall, a change called ___.","description":"Freshwater pondweed is treated with a concentrated marine salt solution. Under a microscope, each cell's contents have shrunk into a ball separated from its rigid wall. What is this condition called?","confusables":[],"sourcePages":[36,41,46,47,55,58,59],"correction":null},{"word":"cytolysis","pos":"process","definition":"bursting of a cell, usually an animal cell, after too much water enters it","contextSentence":"Giving a patient pure water through an IV would risk cytolysis of red blood cells, which is why IV fluids contain salts.","clozeSentence":"With no cell wall to resist expansion, an animal cell in a strongly hypotonic solution keeps gaining water until ___ occurs.","description":"Red blood cells are placed in distilled water. Within minutes the liquid turns clear red as hemoglobin leaks out and intact cells disappear. What is this event called?","confusables":[],"sourcePages":[46,47],"correction":"Notes said a cell with more solute inside than outside gains water and bursts; correct: only cells without walls, such as animal cells, burst, while plant cells become turgid because the wall resists expansion."},{"word":"crenation","pos":"process","definition":"shriveling of an animal cell, such as a red blood cell, as it loses water","contextSentence":"Red blood cells placed in 9% NaCl undergo crenation, developing a shrunken, spiky outline as water leaves them by osmosis.","clozeSentence":"When red blood cells lose water to a hypertonic solution, they shrink and develop a spiky, scalloped outline, a change called ___.","description":"A blood sample is accidentally stored in concentrated salt solution. Under the microscope, the cells look shrunken and spiky instead of smooth discs. What is this change called?","confusables":[],"sourcePages":[36,46,47,58],"correction":null},{"word":"fluid mosaic model","pos":"concept","definition":"description of the membrane as a moving patchwork of lipids, proteins and attached carbohydrates","contextSentence":"The fluid mosaic model explains why tagged surface proteins from a mouse cell and a human cell intermix within about an hour after the cells are fused.","clozeSentence":"According to the ___, membrane phospholipids and many proteins drift sideways, while varied proteins, cholesterol and carbohydrates form a patchwork.","description":"Freeze-fracture images show many different proteins scattered through the bilayer, and tagging experiments show those proteins and lipids drifting sideways. Which overall model of membrane structure do these observations support?","confusables":[],"sourcePages":[1,3,4,15,16],"correction":"Notes listed 'secondary protein' as a membrane component; correct: the components are phospholipids, cholesterol, integral and peripheral proteins, and carbohydrates on glycoproteins and glycolipids."},{"word":"selective permeability","pos":"concept","definition":"property of letting some substances cross a membrane more easily than others","contextSentence":"Because of selective permeability, O2 and CO2 slip straight through the bilayer while Na+ ions and glucose must use transport proteins.","clozeSentence":"The hydrophobic interior of the phospholipid bilayer, along with specific transport proteins, gives the membrane ___, letting a cell control its contents.","description":"Dialysis tubing lets water and glucose pass through but blocks starch. Which property of cell membranes is this tubing being used to model?","confusables":[],"sourcePages":[9,10,13,14,15,20,21,30,61,62],"correction":"Notes said phospholipids 'prevent interactions from occurring and causing harm'; correct: the bilayer's hydrophobic interior restricts ions and large polar molecules, so only some substances cross freely."},{"word":"membrane fluidity","pos":"concept","definition":"how freely phospholipids and proteins can move sideways within the membrane","contextSentence":"Plants in cold climates maintain membrane fluidity by making more phospholipids with unsaturated, kinked fatty acid tails that cannot pack tightly.","clozeSentence":"Cholesterol buffers ___, restraining phospholipid movement at warm temperatures and preventing tight packing at cold temperatures.","description":"Bacteria moved from 37 °C to 15 °C start making more phospholipids with double-bonded fatty acid tails, which keeps their membranes from turning gel-like. Which membrane property are they maintaining?","confusables":[],"sourcePages":[16,18],"correction":null},{"word":"concentration gradient","pos":"concept","definition":"a difference in how much of a substance is present per volume between two regions","contextSentence":"O2 diffuses from the lungs' air sacs into the blood because a concentration gradient exists, with more O2 in the air sacs than in the blood.","clozeSentence":"Facilitated diffusion of glucose needs no ATP, because the potential energy stored in the uneven distribution of glucose, its ___, drives net movement.","description":"In a membrane diagram, glucose molecules are crowded on the left and sparse on the right, and over time they become evenly spread. What was driving their net movement?","confusables":["electrochemical gradient"],"sourcePages":[21,30,31,48,63],"correction":null},{"word":"electrochemical gradient","pos":"concept","definition":"combined push on an ion from its concentration difference and the membrane's charge difference","contextSentence":"Na+ rushes into a neuron when its channels open because the electrochemical gradient favors entry: Na+ is more concentrated outside, and the inside is negative.","clozeSentence":"For a charged ion, the combination of its concentration difference and the voltage across the membrane makes up its ___.","description":"K+ is more concentrated inside a cell, which pushes it outward, yet the negative interior attracts it back in. What term describes the overall driving force that combines both effects?","confusables":["concentration gradient","membrane potential"],"sourcePages":[71,72,73,75],"correction":null},{"word":"membrane potential","pos":"concept","definition":"the voltage across a membrane caused by an unequal distribution of charges","contextSentence":"By moving 3 Na+ out for every 2 K+ in, the sodium-potassium pump helps maintain the membrane potential, keeping the cytoplasm negative relative to the outside.","clozeSentence":"Measured in millivolts, a typical animal cell's ___ is negative inside because more positive charge sits just outside the membrane.","description":"An electrode inside a resting neuron reads about −70 mV compared with the fluid outside the cell. What property of the membrane is being measured?","confusables":["electrochemical gradient"],"sourcePages":[26,29,30,72,75],"correction":null},{"word":"dynamic equilibrium","pos":"concept","definition":"state in which molecules keep moving in both directions but with no net change","contextSentence":"Once a dialysis bag and its beaker reach dynamic equilibrium, water molecules still cross the tubing both ways, but the bag's mass stops changing.","clozeSentence":"When concentrations become equal on both sides of a membrane, molecules continue to cross in both directions, but at ___ there is no net movement.","description":"After several hours, a glucose-filled bag in a beaker shows no further mass change, yet radioactive water added to the beaker soon appears inside the bag. What state has the system reached?","confusables":["isotonic"],"sourcePages":[63,64],"correction":null},{"word":"tonicity","pos":"concept","definition":"ability of a surrounding solution to make a cell gain or lose water","contextSentence":"Doctors match the tonicity of IV fluids to blood plasma so that red blood cells neither swell nor shrink when the fluid enters a vein.","clozeSentence":"The words hypotonic, isotonic and hypertonic describe ___, which depends only on solutes that cannot cross the cell membrane.","description":"A 0.3 M urea solution and a 0.3 M sucrose solution have the same total solute concentration, but red blood cells swell and burst only in the urea. What property differs between the two solutions?","confusables":["osmolarity"],"sourcePages":[36,37,46,56,57],"correction":null},{"word":"osmolarity","pos":"concept","definition":"the total concentration of dissolved solute particles in a solution","contextSentence":"Because NaCl splits into two ions, a 0.5 M NaCl solution has roughly twice the osmolarity of a 0.5 M sucrose solution.","clozeSentence":"Seawater has a much higher ___ than human body fluids, counted as osmoles of dissolved particles per liter of solution.","description":"A lab report gives each solution's concentration as moles of dissolved particles per liter, so 0.1 M NaCl is listed as 0.2 and 0.2 M glucose as 0.2. What quantity is being reported?","confusables":["tonicity"],"sourcePages":[36,37,45],"correction":null},{"word":"water potential","pos":"concept","definition":"potential energy of water per unit volume, which predicts the direction water will move","contextSentence":"In a tall tree, water potential falls from soil to roots to leaves to air, so water moves upward toward the leaves.","clozeSentence":"Because it combines both pressure and solute effects, ___ predicts that water will move from a region at −2 bars to one at −8 bars.","description":"A potato cell has Ψs = −4 bars and Ψp = +1 bar, and the surrounding solution measures −5 bars. Which quantity, compared for the cell and the solution, shows that water will leave the cell?","confusables":[],"sourcePages":[36,37,40,51,52,53,54,55,65,68],"correction":"Notes said water potential is measured with a barometer; correct: a barometer measures air pressure, while water potential is calculated or measured with instruments such as a pressure chamber."},{"word":"solute potential","pos":"concept","definition":"part of water potential due to dissolved particles; zero or negative, found by −iCRT","contextSentence":"At 22 °C, a 1.0 M sucrose solution has a solute potential of about −24.5 bars, calculated with the equation Ψs = −iCRT.","clozeSentence":"Adding salt to water makes its ___ more negative, since dissolved ions bind water molecules; this component is calculated as −iCRT.","description":"Two open beakers hold 0.5 M sucrose and 0.5 M NaCl at the same temperature. Which component of water potential is about twice as negative in the NaCl, because NaCl splits into two ions?","confusables":[],"sourcePages":[37,40,51,52,53,65,68],"correction":"Notes gave the solute potential of 1.0 M sucrose at 22 °C as 24.5 bars; correct: it is −24.5 bars, since solute potential is never positive."},{"word":"pressure potential","pos":"concept","definition":"part of water potential due to physical pressure on water; zero in an open container","contextSentence":"A potato cell in pure water gains water until its pressure potential rises to +3 bars, exactly cancelling its −3 bar solute potential.","clozeSentence":"In an open beaker, ___ equals zero, so the solution's water potential is simply equal to its solute potential.","description":"A wilted plant is watered, and its cells' water potential rises from −6 to −2 bars even though their solute concentration barely changes. Which component of water potential increased?","confusables":["turgor pressure"],"sourcePages":[37,40,52,53,65],"correction":"Notes said the two components of water potential are solute concentration and solvent concentration; correct: they are solute potential and pressure potential."},{"word":"turgor pressure","pos":"concept","definition":"outward push of a plant cell's contents against its cell wall","contextSentence":"Grocery stores mist celery with water so its cells absorb water and build turgor pressure, keeping the stalks crisp.","clozeSentence":"When water fills a plant cell's central vacuole, the membrane presses outward against the rigid cell wall, creating ___ that helps hold the plant upright.","description":"A houseplant left unwatered for a week droops, but its stems stiffen again within hours of watering. What force inside its cells was restored?","confusables":["pressure potential"],"sourcePages":[40,45,50,65],"correction":null},{"word":"solute","pos":"concept","definition":"a substance dissolved in another substance to form a solution","contextSentence":"In ocean water, NaCl is the main solute, and its dissolved ions give seawater a much lower water potential than fresh water.","clozeSentence":"In a glass of sugar water, the sugar is the dissolved ___ and the water is the solvent that dissolves it.","description":"A student stirs table salt into water until it disappears and the mixture looks clear. In this mixture, what role does the salt play?","confusables":[],"sourcePages":[45],"correction":"Notes defined a solute as sugar; correct: a solute is any dissolved substance, such as sugar, salt or ions."},{"word":"solvent","pos":"concept","definition":"the substance, often water, that dissolves other substances in a solution","contextSentence":"Water's polarity makes it an excellent solvent for ions and polar molecules like glucose, so the cytosol can carry many dissolved substances.","clozeSentence":"In a living cell, water is the ___ in which salts, sugars and many proteins are dissolved.","description":"In the cytoplasm, glucose, K+ ions and amino acids are dissolved and spread throughout the water. What role does the water play?","confusables":[],"sourcePages":[45],"correction":null},{"word":"amphipathic","pos":"descriptor","definition":"having both a hydrophilic (polar) region and a hydrophobic (nonpolar) region","contextSentence":"Because phospholipids are amphipathic, they spontaneously arrange into bilayers in water, with heads facing outward and tails tucked inside.","clozeSentence":"A phospholipid as a whole is described as ___ because its phosphate head is polar while its two fatty acid tails are nonpolar.","description":"A detergent molecule has a charged end that dissolves in water and a long hydrocarbon end that dissolves in grease. What word describes molecules with this two-part structure?","confusables":[],"sourcePages":[3,4,6,7],"correction":null},{"word":"hydrophilic","pos":"descriptor","definition":"polar or charged, so it interacts readily with water","contextSentence":"Amino acids with charged R groups make the outer loops of a transmembrane protein hydrophilic, so those loops sit in the watery cytosol or extracellular fluid.","clozeSentence":"The phosphate heads of a phospholipid are polar and ___, so they face the watery environments inside and outside the cell.","description":"A channel protein's central pore is lined with amino acids that have polar and charged side chains, allowing ions to pass. How would you describe the lining of this pore?","confusables":[],"sourcePages":[3,4,6,7,17,18],"correction":null},{"word":"hydrophobic","pos":"descriptor","definition":"nonpolar, so it is excluded from water and clusters with other nonpolar substances","contextSentence":"The hydrophobic core of the bilayer blocks ions like Na+ and K+, which is why they need transport proteins to cross the membrane.","clozeSentence":"Fatty acid tails are nonpolar and ___, so in water they cluster together in the membrane interior, away from the surrounding water.","description":"The section of a transmembrane protein that spans the bilayer is rich in amino acids with nonpolar side chains. How would you describe this region of the protein?","confusables":[],"sourcePages":[3,4,6,7,17,18],"correction":null},{"word":"hypotonic","pos":"descriptor","definition":"having a lower solute concentration than the solution it is compared to","contextSentence":"Pure water in an IV would be hypotonic to red blood cells, so water would rush into them until they swell and burst.","clozeSentence":"A marine fish moved into a freshwater tank swells because fresh water is ___ to its body fluids, so water enters by osmosis.","description":"Sliced celery placed in a bowl of tap water becomes crisp as its cells gain water. Compared with the celery cells, how would you describe the tap water?","confusables":[],"sourcePages":[36,45,46,47,50,56,58],"correction":null},{"word":"hypertonic","pos":"descriptor","definition":"having a higher solute concentration than the solution it is compared to","contextSentence":"Sprinkling sugar on strawberries creates a hypertonic environment around the fruit cells, drawing water out of them so juice pools in the bowl.","clozeSentence":"Salting meat preserves it because the salty surroundings are ___ to bacterial cells, which lose water by osmosis and cannot grow.","description":"Red blood cells placed in 9% NaCl shrink as water leaves them. Compared with the cells' contents, how would you describe the 9% NaCl solution?","confusables":[],"sourcePages":[36,45,46,47,50,56,58],"correction":null},{"word":"isotonic","pos":"descriptor","definition":"having the same solute concentration as the solution it is compared to","contextSentence":"IV fluids are made with 0.9% NaCl because that solution is isotonic to red blood cells, so the cells neither swell nor shrink.","clozeSentence":"On a graph of potato mass change versus sucrose molarity, the point where the line crosses 0% marks the solution that is ___ to the potato cells.","description":"An animal cell containing 0.7 mM salt is placed in a 0.7 mM salt solution, and water crosses the membrane equally in both directions. How would you describe the solution relative to the cell?","confusables":["dynamic equilibrium","flaccid"],"sourcePages":[36,39,45,46,47,56,58],"correction":null},{"word":"turgid","pos":"descriptor","definition":"firm and swollen because water has pushed the membrane hard against the cell wall","contextSentence":"Plant cells are healthiest when turgid, which happens when they sit in hypotonic surroundings and their central vacuoles fill with water.","clozeSentence":"A plant cell in pure water does not burst; instead its wall resists expansion and the cell becomes firm, or ___.","description":"A wilted lettuce leaf is soaked in cold water and becomes crisp because each cell swells and presses against its wall. Which word describes the firmness of the cells now?","confusables":[],"sourcePages":[41,46,47,68],"correction":null},{"word":"flaccid","pos":"descriptor","definition":"limp, because the cell has no net water uptake and does not press firmly against its wall","contextSentence":"When a houseplant's cells become flaccid, they no longer press firmly against their walls, and the leaves and stems begin to wilt.","clozeSentence":"In an isotonic solution, a plant cell has no net water gain, so it lacks firm turgor and becomes limp, or ___.","description":"Plant cells are placed in a solution matching their own water potential. With no net water movement, the cells feel soft rather than firm. Which word describes the cells' condition?","confusables":["isotonic"],"sourcePages":[46,47],"correction":null}];
const BIO3_DATA = [{"word":"exergonic","pos":"descriptor","definition":"releasing free energy overall, so products have less free energy than reactants (ΔG < 0)","contextSentence":"ATP hydrolysis is exergonic, releasing about 7.3 kcal/mol of free energy under standard conditions as ATP becomes ADP and inorganic phosphate.","clozeSentence":"A reaction with a ΔG below zero is called ___ and is spontaneous, although without an enzyme it may still be extremely slow.","description":"On an energy diagram the products sit lower than the reactants, and the reaction happens on its own but only very slowly without an enzyme. How is this reaction classified by its free-energy change?","confusables":["catabolic"],"sourcePages":[5,6,48,88,95],"correction":"Notes' printed energy diagram labeled the exergonic reaction +ΔG; correct: exergonic reactions have a negative ΔG."},{"word":"endergonic","pos":"descriptor","definition":"absorbing free energy overall, so products have more free energy than reactants (ΔG > 0)","contextSentence":"Photosynthesis is endergonic: light energy is used to build glucose, which has more free energy than the CO2 and water it came from.","clozeSentence":"Making glutamine from glutamic acid and ammonia has a ΔG of +3.4 kcal/mol, so on its own this reaction is ___ and nonspontaneous.","description":"A cell links monomers into a polymer only by coupling the reaction to ATP hydrolysis, because the linking reaction by itself has a positive ΔG. How is the linking reaction by itself classified by its free-energy change?","confusables":["anabolic"],"sourcePages":[5,6,7,88,95],"correction":"Notes' printed energy diagram labeled the endergonic reaction −ΔG; correct: endergonic reactions, such as photosynthesis, have a positive ΔG."},{"word":"anabolic","pos":"descriptor","definition":"describing pathways that build larger molecules from smaller ones, using energy","contextSentence":"Protein synthesis is anabolic, linking amino acids into polypeptides in a process that consumes energy from ATP and GTP.","clozeSentence":"Photosynthesis is classified as ___ because it builds glucose from small molecules like CO2 and water, the reverse of breaking molecules down.","description":"After a meal, liver cells link thousands of glucose molecules into glycogen, spending energy to do it. What type of metabolic pathway is this?","confusables":["endergonic"],"sourcePages":[4,51],"correction":null},{"word":"catabolic","pos":"descriptor","definition":"describing pathways that break large molecules into smaller ones, releasing energy","contextSentence":"Cellular respiration is catabolic, breaking glucose down into CO2 and water while capturing part of the released energy in ATP.","clozeSentence":"Digestion of starch into glucose is an example of ___ metabolism, the opposite of building polymers from monomers.","description":"During a long fast, muscle cells break stored glycogen into glucose and then oxidize the glucose to CO2. What type of metabolic pathway is this?","confusables":["exergonic"],"sourcePages":[4,51],"correction":null},{"word":"aerobic","pos":"descriptor","definition":"requiring oxygen, as in respiration that uses O2 as the final electron acceptor","contextSentence":"Aerobic respiration uses O2 as the final electron acceptor of the electron transport chain and yields roughly 30-32 ATP per glucose.","clozeSentence":"The electron transport chain is described as ___ because it stops working once no oxygen is available to accept electrons at its end.","description":"During a slow jog, a runner's muscle cells get enough O2 to keep their electron transport chains running and make about 30 ATP per glucose. How is this metabolism described with respect to oxygen?","confusables":[],"sourcePages":[59,62,75],"correction":null},{"word":"anaerobic","pos":"descriptor","definition":"occurring without oxygen; not requiring O2","contextSentence":"Glycolysis is anaerobic: it takes place in the cytosol and splits glucose into two pyruvate without needing any oxygen.","clozeSentence":"Some prokaryotes carry out ___ respiration, passing electrons down a transport chain to nitrate instead of to oxygen.","description":"Yeast sealed in a jar with no air keep making a little ATP and CO2 by fermentation. Which term describes this metabolism with respect to oxygen?","confusables":[],"sourcePages":[59,60,63,75],"correction":"Notes called fermentation a form of anaerobic respiration; correct: anaerobic respiration uses an electron transport chain with a non-O2 final electron acceptor, while fermentation uses no electron transport chain and passes NADH's electrons to an organic molecule."},{"word":"enzyme","pos":"molecule","definition":"a biological catalyst, usually a protein, that speeds a reaction by lowering activation energy","contextSentence":"Each of the ten steps of glycolysis is catalyzed by a specific enzyme, such as hexokinase, which adds a phosphate to glucose.","clozeSentence":"Lactase, the ___ that hydrolyzes lactose into glucose and galactose, is not used up by the reaction and can be reused many times.","description":"Hydrogen peroxide breaks down very slowly on its own, but potato extract makes it fizz instantly, and boiled extract has no effect. What kind of molecule in the extract causes this?","confusables":["ATP synthase","catalase","ribozyme","rubisco"],"sourcePages":[9,11,15,21],"correction":"Notes said doubling lactase at a high lactose concentration leaves the rate unchanged; correct: when substrate is plentiful, more enzyme provides more active sites, so the rate increases."},{"word":"substrate","pos":"molecule","definition":"the reactant that binds an enzyme's active site and is changed by the reaction","contextSentence":"In the lactase simulation, raising the concentration of the substrate lactose increased the initial rate until the active sites were saturated.","clozeSentence":"Hydrogen peroxide is the ___ of catalase: it binds the active site and is converted into water and oxygen gas.","description":"In the pathway X → Y → Z → A, molecule X binds the active site of the first enzyme and is converted into Y. What is X's role for that enzyme?","confusables":[],"sourcePages":[9,11,21,36,41],"correction":"Notes said substance X in the pathway X → Y → Z → A is an allosteric inhibitor or an intermediate; correct: X is the substrate of the first enzyme."},{"word":"ribozyme","pos":"molecule","definition":"an RNA molecule that acts as a catalyst","contextSentence":"The rRNA in a ribosome works as a ribozyme, catalyzing peptide bond formation between amino acids during translation.","clozeSentence":"Because the ribosome's peptide-bond-forming site is made of rRNA rather than protein, the ribosome is a classic example of ___ catalysis.","description":"Researchers find that a purified RNA strand, with no protein present, speeds up the cutting of another RNA molecule without being used up. What is this RNA?","confusables":["enzyme"],"sourcePages":[15],"correction":null},{"word":"cofactor","pos":"molecule","definition":"a nonprotein helper, often an inorganic metal ion, that an enzyme needs to function","contextSentence":"Many enzymes need a cofactor, such as a zinc or magnesium ion bound near the active site, before they can catalyze their reaction.","clozeSentence":"Zinc acts as an inorganic ___ for carbonic anhydrase: without the bound Zn²⁺ ion near its active site, the enzyme cannot catalyze its reaction.","description":"An enzyme loses all activity when a chemical that traps metal ions is added, and activity returns when Mg²⁺ is added back and binds at the active site. What is Mg²⁺ for this enzyme?","confusables":["FADH2","NAD+","NADH","NADP+","NADPH","coenzyme"],"sourcePages":[9,10],"correction":null},{"word":"coenzyme","pos":"molecule","definition":"an organic, nonprotein helper molecule, often made from a vitamin, that an enzyme needs","contextSentence":"NAD+ serves as a coenzyme for dehydrogenases, accepting the electrons they remove from glucose durin
